<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProcessingJS Mouse Rectangle Converter</title>
<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #171717;
    color: white;
    font-family: Arial, sans-serif;
}

#toolbar {
    position: absolute;
    left: 0;
    top: 0;
    width: 175px;
    height: 100%;
    background: #222;
    border-right: 1px solid #444;
    padding: 8px;
    z-index: 100;
    overflow-y: auto;
}

button {
    width: 100%;
    background: #333;
    color: white;
    border: 1px solid #666;
    border-radius: 5px;
    padding: 9px 8px;
    margin-bottom: 7px;
    cursor: pointer;
}

button:hover {
    background: #444;
}

button.active {
    background: #1267a5;
    border-color: #63b8ff;
}

#sizeSection {
    border-top: 1px solid #444;
    margin-top: 5px;
    padding-top: 10px;
}

#sizeSection label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin-bottom: 3px;
}

#sizeSection input {
    width: 100%;
    height: 30px;
    margin-bottom: 8px;
    padding: 4px 7px;
    border: 1px solid #555;
    border-radius: 4px;
    background: #111;
    color: white;
}

#editor {
    position: absolute;
    left: 175px;
    top: 0;
    width: calc(100% - 175px);
    height: 100%;
    background: #111;
    color: #eee;
    border: 0;
    outline: 0;
    resize: none;
    padding: 15px;
    font: 14px/1.4 monospace;
    tab-size: 4;
    white-space: pre;
    overflow: auto;
}

#stage {
    position: absolute;
    left: 175px;
    top: 0;
    width: calc(100% - 175px);
    height: 100%;
    display: none;
    background: #222;
    overflow: hidden;
}

#program {
    position: absolute;
    border: 0;
    background: white;
    display: block;
}

#overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#info {
    position: absolute;
    left: 12px;
    top: 12px;
    background: rgba(0, 0, 0, 0.82);
    padding: 8px 10px;
    border-radius: 5px;
    font: 13px monospace;
    display: none;
    z-index: 20;
    pointer-events: none;
}

#outputs {
    position: absolute;
    right: 10px;
    top: 10px;
    width: 300px;
    max-height: calc(100% - 20px);
    overflow-y: auto;
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 30;
}

.outputBox {
    background: rgba(16, 16, 16, 0.96);
    border: 1px solid #555;
    border-radius: 5px;
    overflow: hidden;
}

.outputTitle {
    background: #292929;
    border-bottom: 1px solid #444;
    padding: 7px 9px;
    font: bold 12px Arial, sans-serif;
}

.outputText {
    display: block;
    width: 100%;
    min-height: 70px;
    max-height: 240px;
    resize: vertical;
    border: 0;
    outline: 0;
    padding: 9px;
    background: #101010;
    color: #b7ffb7;
    font: 12px/1.4 monospace;
}

#contextMenu {
    position: fixed;
    width: 145px;
    display: none;
    background: #292929;
    border: 1px solid #555;
    border-radius: 5px;
    padding: 4px;
    z-index: 1000;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.5);
}

#contextMenu button {
    margin: 0;
    border: 0;
    border-radius: 3px;
    background: transparent;
    text-align: left;
    padding: 8px;
}

#contextMenu button:hover {
    background: #1267a5;
}

#contextMenu .delete:hover {
    background: #a52a2a;
}

#status {
    color: #777;
    font: 10px monospace;
    margin-top: 5px;
    word-break: break-word;
}
</style>
</head>

<body>

<div id="toolbar">
    <button id="runButton">Run</button>
    <button id="editButton">Edit Code</button>
    <button id="normalButton" class="active">Normal Mode</button>
    <button id="rectButton">Rect Mode</button>
    <button id="editRectButton">Edit Rects</button>
    <button id="printButton">Print / Copy</button>
    <button id="clearButton">Clear</button>

    <div id="sizeSection">
        <label for="widthInput">Canvas Width</label>
        <input id="widthInput" type="number" min="1" value="400">

        <label for="heightInput">Canvas Height</label>
        <input id="heightInput" type="number" min="1" value="400">
    </div>

    <div id="status"></div>
</div>

<textarea id="editor" spellcheck="false">size(400, 400);
background(220);

fill(255, 0, 0);
rect(20, 120, 340, 45);

fill(0, 0, 255);
rect(20, 170, 340, 45);

function mousePressed() {
    if (mouseX >= 20 && mouseX <= 360 && mouseY >= 120 && mouseY <= 165) {
        println("First button");
    }

    if (mouseX >= 20 && mouseX <= 360 && mouseY >= 170 && mouseY <= 215) {
        println("Second button");
    }
}</textarea>

<div id="stage">
    <iframe id="program" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    <canvas id="overlay"></canvas>
    <div id="info"></div>

    <div id="outputs">
        <div id="originalBox" class="outputBox">
            <div class="outputTitle">Originally</div>
            <textarea id="originalOutput" class="outputText" readonly></textarea>
        </div>

        <div id="updatedBox" class="outputBox">
            <div class="outputTitle">Updated</div>
            <textarea id="updatedOutput" class="outputText" readonly></textarea>
        </div>

        <div id="newBox" class="outputBox">
            <div class="outputTitle">New</div>
            <textarea id="newOutput" class="outputText" readonly></textarea>
        </div>
    </div>
</div>

<div id="contextMenu">
    <button id="duplicateButton">Duplicate</button>
    <button id="cutButton">Cut</button>
    <button id="copyButton">Copy</button>
    <button id="pasteButton">Paste</button>
    <button id="deleteButton" class="delete">Delete</button>
</div>

<script>
const editor = document.getElementById("editor");
const stage = document.getElementById("stage");
const program = document.getElementById("program");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");

const info = document.getElementById("info");
const outputs = document.getElementById("outputs");

const originalBox = document.getElementById("originalBox");
const updatedBox = document.getElementById("updatedBox");
const newBox = document.getElementById("newBox");

const originalOutput = document.getElementById("originalOutput");
const updatedOutput = document.getElementById("updatedOutput");
const newOutput = document.getElementById("newOutput");

const runButton = document.getElementById("runButton");
const editButton = document.getElementById("editButton");
const normalButton = document.getElementById("normalButton");
const rectButton = document.getElementById("rectButton");
const editRectButton = document.getElementById("editRectButton");
const printButton = document.getElementById("printButton");
const clearButton = document.getElementById("clearButton");

const widthInput = document.getElementById("widthInput");
const heightInput = document.getElementById("heightInput");
const status = document.getElementById("status");

const contextMenu = document.getElementById("contextMenu");
const duplicateButton = document.getElementById("duplicateButton");
const cutButton = document.getElementById("cutButton");
const copyButton = document.getElementById("copyButton");
const pasteButton = document.getElementById("pasteButton");
const deleteButton = document.getElementById("deleteButton");

let mode = "normal";
let rectangles = [];
let selectedRectangle = null;
let clipboardRectangle = null;

let drawing = false;
let dragging = false;
let resizing = false;

let startX = 0;
let startY = 0;
let dragOffsetX = 0;
let dragOffsetY = 0;

let resizeStartX = 0;
let resizeStartY = 0;
let resizeOriginal = null;

let canvasWidth = 400;
let canvasHeight = 400;

let tempRectangle = null;
let drawPending = false;

function requestDraw() {
    if (drawPending) {
        return;
    }

    drawPending = true;

    requestAnimationFrame(function() {
        drawPending = false;
        drawRectangles();
    });
}

function setStatus(text) {
    status.textContent = text;
}

function getCanvasSize() {
    let width = Number(widthInput.value);
    let height = Number(heightInput.value);

    if (!Number.isFinite(width) || width < 1) {
        width = 400;
    }

    if (!Number.isFinite(height) || height < 1) {
        height = 400;
    }

    return {
        width: Math.round(width),
        height: Math.round(height)
    };
}

function hasSizeCall(code) {
    return /\bsize\s*\(/.test(code);
}

function isFullHTML(code) {
    const beginning = code.slice(0, 4000);

    return (
        /<!doctype\s+html/i.test(beginning) ||
        /<html(?:\s|>)/i.test(beginning) ||
        /<body(?:\s|>)/i.test(beginning)
    );
}

function escapeScriptEnd(code) {
    return code.replace(/<\/script/gi, "<\\/script");
}

function createProcessingHTML(source) {
    const sizeCode = hasSizeCall(source)
        ? ""
        : "size(" + canvasWidth + ", " + canvasHeight + ");";

    const safeSource = escapeScriptEnd(source);

    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html,body {
    margin:0;
    padding:0;
    overflow:hidden;
}
canvas {
    display:block;
}
</style>
</head>
<body>
<canvas id="mycanvas" width="${canvasWidth}" height="${canvasHeight}"></canvas>
<script src="https://cdn.jsdelivr.net/processing.js/1.4.8/processing.min.js"><\\/script>
<script>
var programCode = function(processingInstance) {
    with (processingInstance) {
        ${sizeCode}
        ${safeSource}
    }
};

var canvas = document.getElementById("mycanvas");
var processingInstance = new Processing(canvas, programCode);
<\\/script>
</body>
</html>`;
}

function prepareFullHTML(source) {
    if (hasSizeCall(source)) {
        return escapeScriptEnd(source);
    }

    let result = escapeScriptEnd(source);

    const canvasRegex = /<canvas\b([^>]*)>/i;
    const match = result.match(canvasRegex);

    if (match) {
        let attributes = match[1];

        attributes = attributes
            .replace(/\swidth\s*=\s*["'][^"']*["']/gi, "")
            .replace(/\sheight\s*=\s*["'][^"']*["']/gi, "");

        const canvas =
            "<canvas" +
            attributes +
            ' width="' + canvasWidth + '"' +
            ' height="' + canvasHeight + '">';

        result = result.replace(
            canvasRegex,
            canvas
        );

        return result;
    }

    return result;
}

function getProgramHTML() {
    const source = editor.value;

    if (isFullHTML(source)) {
        return prepareFullHTML(source);
    }

    return createProcessingHTML(source);
}

function findMatchingBrace(text, openIndex) {
    let depth = 0;
    let quote = "";
    let escaped = false;
    let lineComment = false;
    let blockComment = false;

    for (let i = openIndex; i < text.length; i++) {
        const c = text[i];
        const n = text[i + 1];

        if (lineComment) {
            if (c === "\n") {
                lineComment = false;
            }
            continue;
        }

        if (blockComment) {
            if (c === "*" && n === "/") {
                blockComment = false;
                i++;
            }
            continue;
        }

        if (quote) {
            if (escaped) {
                escaped = false;
            } else if (c === "\\") {
                escaped = true;
            } else if (c === quote) {
                quote = "";
            }
            continue;
        }

        if (c === "/" && n === "/") {
            lineComment = true;
            i++;
            continue;
        }

        if (c === "/" && n === "*") {
            blockComment = true;
            i++;
            continue;
        }

        if (
            c === "\"" ||
            c === "'" ||
            c === "`"
        ) {
            quote = c;
            continue;
        }

        if (c === "{") {
            depth++;
        } else if (c === "}") {
            depth--;

            if (depth === 0) {
                return i;
            }
        }
    }

    return -1;
}

function getMouseFunctionBodies(source) {
    const bodies = [];

    const pattern =
        /(?:function\s+)?(mousePressed|mouseClicked|mouseReleased|mouseDragged|mouseMoved|mouseOver|mouseOut)\s*(?:=\s*function)?\s*\([^)]*\)\s*\{/g;

    let match;

    while ((match = pattern.exec(source)) !== null) {
        const openBrace =
            source.indexOf(
                "{",
                match.index
            );

        if (openBrace < 0) {
            continue;
        }

        const closeBrace =
            findMatchingBrace(
                source,
                openBrace
            );

        if (closeBrace < 0) {
            continue;
        }

        bodies.push(
            source.slice(
                openBrace + 1,
                closeBrace
            )
        );

        pattern.lastIndex =
            closeBrace + 1;
    }

    return bodies;
}

function extractProcessingScript(source) {
    if (!isFullHTML(source)) {
        return source;
    }

    const result = [];
    const pattern =
        /<script\b[^>]*>([\s\S]*?)<\/script>/gi;

    let match;

    while ((match = pattern.exec(source)) !== null) {
        if (
            /\bmousePressed\b/.test(match[1]) ||
            /\bmouseClicked\b/.test(match[1]) ||
            /\bmouseReleased\b/.test(match[1]) ||
            /\bmouseDragged\b/.test(match[1]) ||
            /\bmouseMoved\b/.test(match[1])
        ) {
            result.push(match[1]);
        }
    }

    return result.join("\n");
}

function parseMouseRectangles(source) {
    const bodies =
        getMouseFunctionBodies(
            extractProcessingScript(source)
        );

    const result = [];

    for (const body of bodies) {
        const ifPattern =
            /\bif\s*\(([^{}]*)\)/g;

        let match;

        while (
            (match =
                ifPattern.exec(body)) !== null
        ) {
            const condition = match[1];

            if (
                !/\bmouseX\b/.test(condition) ||
                !/\bmouseY\b/.test(condition)
            ) {
                continue;
            }

            const xValues = [];
            const yValues = [];

            const xPattern =
                /mouseX\s*(>=|<=|>|<)\s*(-?(?:\d+(?:\.\d*)?|\.\d+))/g;

            const yPattern =
                /mouseY\s*(>=|<=|>|<)\s*(-?(?:\d+(?:\.\d*)?|\.\d+))/g;

            let xMatch;
            let yMatch;

            while (
                (xMatch =
                    xPattern.exec(condition)) !== null
            ) {
                xValues.push({
                    operator: xMatch[1],
                    value: Number(xMatch[2])
                });
            }

            while (
                (yMatch =
                    yPattern.exec(condition)) !== null
            ) {
                yValues.push({
                    operator: yMatch[1],
                    value: Number(yMatch[2])
                });
            }

            if (
                xValues.length < 2 ||
                yValues.length < 2
            ) {
                continue;
            }

            let minX = -Infinity;
            let maxX = Infinity;
            let minY = -Infinity;
            let maxY = Infinity;

            for (const item of xValues) {
                if (
                    item.operator === ">=" ||
                    item.operator === ">"
                ) {
                    minX =
                        Math.max(
                            minX,
                            item.value
                        );
                } else {
                    maxX =
                        Math.min(
                            maxX,
                            item.value
                        );
                }
            }

            for (const item of yValues) {
                if (
                    item.operator === ">=" ||
                    item.operator === ">"
                ) {
                    minY =
                        Math.max(
                            minY,
                            item.value
                        );
                } else {
                    maxY =
                        Math.min(
                            maxY,
                            item.value
                        );
                }
            }

            if (
                !Number.isFinite(minX) ||
                !Number.isFinite(maxX) ||
                !Number.isFinite(minY) ||
                !Number.isFinite(maxY)
            ) {
                continue;
            }

            if (
                maxX <= minX ||
                maxY <= minY
            ) {
                continue;
            }

            result.push({
                x: minX,
                y: minY,
                width: maxX - minX,
                height: maxY - minY,
                originalX: minX,
                originalY: minY,
                originalWidth: maxX - minX,
                originalHeight: maxY - minY,
                original: true
            });
        }
    }

    return result;
}

function getCanvasInformation() {
    try {
        const iframeRect =
            program.getBoundingClientRect();

        const canvas =
            program.contentDocument.querySelector(
                "canvas"
            );

        if (!canvas) {
            return null;
        }

        const canvasRect =
            canvas.getBoundingClientRect();

        const stageRect =
            stage.getBoundingClientRect();

        return {
            x:
                iframeRect.left +
                canvasRect.left -
                stageRect.left,

            y:
                iframeRect.top +
                canvasRect.top -
                stageRect.top,

            width: canvasRect.width,
            height: canvasRect.height
        };
    } catch {
        return null;
    }
}

function processingToScreen(r) {
    const canvas =
        getCanvasInformation();

    if (
        !canvas ||
        canvas.width <= 0 ||
        canvas.height <= 0
    ) {
        return {
            x: r.x,
            y: r.y,
            width: r.width,
            height: r.height
        };
    }

    return {
        x:
            canvas.x +
            r.x *
            canvas.width /
            canvasWidth,

        y:
            canvas.y +
            r.y *
            canvas.height /
            canvasHeight,

        width:
            r.width *
            canvas.width /
            canvasWidth,

        height:
            r.height *
            canvas.height /
            canvasHeight
    };
}

function screenToProcessing(r) {
    const canvas =
        getCanvasInformation();

    if (
        !canvas ||
        canvas.width <= 0 ||
        canvas.height <= 0
    ) {
        return {
            x: r.x,
            y: r.y,
            width: r.width,
            height: r.height
        };
    }

    return {
        x:
            (r.x - canvas.x) *
            canvasWidth /
            canvas.width,

        y:
            (r.y - canvas.y) *
            canvasHeight /
            canvas.height,

        width:
            r.width *
            canvasWidth /
            canvas.width,

        height:
            r.height *
            canvasHeight /
            canvas.height
    };
}

function drawResizeHandles(r) {
    const s = 8;

    ctx.fillStyle = "#ffb000";

    ctx.fillRect(
        r.x - s / 2,
        r.y - s / 2,
        s,
        s
    );

    ctx.fillRect(
        r.x + r.width - s / 2,
        r.y - s / 2,
        s,
        s
    );

    ctx.fillRect(
        r.x - s / 2,
        r.y + r.height - s / 2,
        s,
        s
    );

    ctx.fillRect(
        r.x + r.width - s / 2,
        r.y + r.height - s / 2,
        s,
        s
    );
}

function drawRectangles() {
    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );

    for (const rectangle of rectangles) {
        const r =
            processingToScreen(
                rectangle
            );

        const selected =
            selectedRectangle === rectangle;

        if (selected) {
            ctx.fillStyle =
                "rgba(255,170,0,0.22)";
            ctx.strokeStyle = "#ffb000";
        } else if (rectangle.original) {
            ctx.fillStyle =
                "rgba(0,140,255,0.22)";
            ctx.strokeStyle = "#00aaff";
        } else {
            ctx.fillStyle =
                "rgba(70,220,120,0.22)";
            ctx.strokeStyle = "#48e080";
        }

        ctx.fillRect(
            r.x,
            r.y,
            r.width,
            r.height
        );

        ctx.lineWidth =
            selected ? 3 : 2;

        ctx.strokeRect(
            r.x,
            r.y,
            r.width,
            r.height
        );

        if (
            selected &&
            mode === "edit"
        ) {
            drawResizeHandles(r);
        }
    }

    if (tempRectangle) {
        ctx.fillStyle =
            "rgba(0,140,255,0.2)";

        ctx.strokeStyle = "#00aaff";
        ctx.lineWidth = 2;

        ctx.fillRect(
            tempRectangle.x,
            tempRectangle.y,
            tempRectangle.width,
            tempRectangle.height
        );

        ctx.strokeRect(
            tempRectangle.x,
            tempRectangle.y,
            tempRectangle.width,
            tempRectangle.height
        );
    }
}

function centerProgram() {
    const x =
        Math.max(
            0,
            (stage.clientWidth -
                canvasWidth) / 2
        );

    const y =
        Math.max(
            0,
            (stage.clientHeight -
                canvasHeight) / 2
        );

    program.style.left =
        Math.round(x) + "px";

    program.style.top =
        Math.round(y) + "px";

    program.style.width =
        canvasWidth + "px";

    program.style.height =
        canvasHeight + "px";

    overlay.width =
        stage.clientWidth;

    overlay.height =
        stage.clientHeight;

    requestDraw();
}

function runProgram() {
    const size =
        getCanvasSize();

    canvasWidth =
        size.width;

    canvasHeight =
        size.height;

    rectangles =
        parseMouseRectangles(
            editor.value
        );

    selectedRectangle = null;
    tempRectangle = null;

    editor.style.display =
        "none";

    stage.style.display =
        "block";

    outputs.style.display =
        "none";

    program.style.pointerEvents =
        "auto";

    overlay.style.pointerEvents =
        "none";

    centerProgram();

    const html =
        getProgramHTML();

    program.srcdoc = html;

    setStatus(
        rectangles.length +
        " mouse rectangle" +
        (rectangles.length === 1
            ? ""
            : "s") +
        " detected"
    );

    setTimeout(
        centerProgram,
        100
    );

    setTimeout(
        centerProgram,
        400
    );

    setTimeout(
        centerProgram,
        1000
    );
}

function editProgram() {
    stage.style.display =
        "none";

    editor.style.display =
        "block";

    outputs.style.display =
        "none";

    contextMenu.style.display =
        "none";

    setStatus(
        "Code editor"
    );
}

function setMode(newMode) {
    mode = newMode;

    normalButton.classList.toggle(
        "active",
        mode === "normal"
    );

    rectButton.classList.toggle(
        "active",
        mode === "rect"
    );

    editRectButton.classList.toggle(
        "active",
        mode === "edit"
    );

    contextMenu.style.display =
        "none";

    if (mode === "normal") {
        program.style.pointerEvents =
            "auto";

        overlay.style.pointerEvents =
            "none";

        info.style.display =
            "none";

        selectedRectangle = null;

        requestDraw();

        return;
    }

    program.style.pointerEvents =
        "none";

    overlay.style.pointerEvents =
        "auto";

    info.style.display =
        "block";

    if (mode === "rect") {
        info.textContent =
            "Drag to create a rectangle";
    } else {
        info.textContent =
            "Drag or resize rectangles • Right-click for options";
    }

    requestDraw();
}

function getPointer(event) {
    const rect =
        overlay.getBoundingClientRect();

    return {
        x:
            event.clientX -
            rect.left,

        y:
            event.clientY -
            rect.top
    };
}

function normalizeRectangle(
    x1,
    y1,
    x2,
    y2
) {
    return {
        x: Math.min(x1, x2),
        y: Math.min(y1, y2),
        width: Math.abs(x2 - x1),
        height: Math.abs(y2 - y1)
    };
}

function getRectangleAt(x, y) {
    for (
        let i = rectangles.length - 1;
        i >= 0;
        i--
    ) {
        const r =
            processingToScreen(
                rectangles[i]
            );

        if (
            x >= r.x &&
            x <= r.x + r.width &&
            y >= r.y &&
            y <= r.y + r.height
        ) {
            return rectangles[i];
        }
    }

    return null;
}

function getCorner(r, x, y) {
    const size = 9;

    if (
        Math.abs(x - r.x) <= size &&
        Math.abs(y - r.y) <= size
    ) {
        return "nw";
    }

    if (
        Math.abs(
            x - (r.x + r.width)
        ) <= size &&
        Math.abs(y - r.y) <= size
    ) {
        return "ne";
    }

    if (
        Math.abs(x - r.x) <= size &&
        Math.abs(
            y - (r.y + r.height)
        ) <= size
    ) {
        return "sw";
    }

    if (
        Math.abs(
            x - (r.x + r.width)
        ) <= size &&
        Math.abs(
            y - (r.y + r.height)
        ) <= size
    ) {
        return "se";
    }

    return null;
}

function sameRectangle(a, b) {
    return (
        Math.abs(a.x - b.x) < 0.01 &&
        Math.abs(a.y - b.y) < 0.01 &&
        Math.abs(a.width - b.width) < 0.01 &&
        Math.abs(a.height - b.height) < 0.01
    );
}

function getOutput(rectangle) {
    const x1 =
        Math.round(
            rectangle.x
        );

    const y1 =
        Math.round(
            rectangle.y
        );

    const x2 =
        Math.round(
            rectangle.x +
            rectangle.width
        );

    const y2 =
        Math.round(
            rectangle.y +
            rectangle.height
        );

    return (
        "if (mouseX >= " +
        x1 +
        " && mouseX <= " +
        x2 +
        " && mouseY >= " +
        y1 +
        " && mouseY <= " +
        y2 +
        ") {\n\n}"
    );
}

function getOutputGroups() {
    const original = [];
    const updated = [];
    const newRects = [];

    for (const r of rectangles) {
        const text =
            getOutput(r);

        if (!r.original) {
            newRects.push(text);
            continue;
        }

        const originalRectangle = {
            x: r.originalX,
            y: r.originalY,
            width: r.originalWidth,
            height: r.originalHeight
        };

        if (
            sameRectangle(
                r,
                originalRectangle
            )
        ) {
            original.push(text);
        } else {
            updated.push(text);
        }
    }

    return {
        original:
            original.join("\n\n"),

        updated:
            updated.join("\n\n"),

        newRects:
            newRects.join("\n\n")
    };
}

function updateBox(
    box,
    textarea,
    text
) {
    if (!text) {
        box.style.display =
            "none";

        textarea.value = "";
        return;
    }

    box.style.display =
        "block";

    textarea.value =
        text;
}

async function printRectangles() {
    const groups =
        getOutputGroups();

    updateBox(
        originalBox,
        originalOutput,
        groups.original
    );

    updateBox(
        updatedBox,
        updatedOutput,
        groups.updated
    );

    updateBox(
        newBox,
        newOutput,
        groups.newRects
    );

    const combined = [
        groups.original,
        groups.updated,
        groups.newRects
    ]
        .filter(Boolean)
        .join("\n\n");

    outputs.style.display =
        combined
            ? "flex"
            : "none";

    if (combined) {
        try {
            await navigator.clipboard.writeText(
                combined
            );

            printButton.textContent =
                "Copied!";

            setTimeout(
                function() {
                    printButton.textContent =
                        "Print / Copy";
                },
                1000
            );
        } catch {
        }
    }
}

function duplicateRectangle() {
    if (!selectedRectangle) {
        return;
    }

    const copy = {
        x:
            selectedRectangle.x + 10,

        y:
            selectedRectangle.y + 10,

        width:
            selectedRectangle.width,

        height:
            selectedRectangle.height,

        originalX:
            selectedRectangle.x + 10,

        originalY:
            selectedRectangle.y + 10,

        originalWidth:
            selectedRectangle.width,

        originalHeight:
            selectedRectangle.height,

        original: false
    };

    rectangles.push(copy);
    selectedRectangle = copy;

    contextMenu.style.display =
        "none";

    requestDraw();
}

function copyRectangle() {
    if (!selectedRectangle) {
        return;
    }

    clipboardRectangle = {
        x: selectedRectangle.x,
        y: selectedRectangle.y,
        width: selectedRectangle.width,
        height: selectedRectangle.height,
        originalX: selectedRectangle.originalX,
        originalY: selectedRectangle.originalY,
        originalWidth: selectedRectangle.originalWidth,
        originalHeight: selectedRectangle.originalHeight,
        original: selectedRectangle.original
    };

    contextMenu.style.display =
        "none";
}

function cutRectangle() {
    if (!selectedRectangle) {
        return;
    }

    copyRectangle();

    rectangles =
        rectangles.filter(
            r => r !== selectedRectangle
        );

    selectedRectangle =
        null;

    requestDraw();
}

function pasteRectangle() {
    if (!clipboardRectangle) {
        return;
    }

    const r = {
        x:
            clipboardRectangle.x + 10,

        y:
            clipboardRectangle.y + 10,

        width:
            clipboardRectangle.width,

        height:
            clipboardRectangle.height,

        originalX:
            clipboardRectangle.x + 10,

        originalY:
            clipboardRectangle.y + 10,

        originalWidth:
            clipboardRectangle.width,

        originalHeight:
            clipboardRectangle.height,

        original: false
    };

    rectangles.push(r);
    selectedRectangle = r;

    contextMenu.style.display =
        "none";

    requestDraw();
}

function deleteRectangle() {
    if (!selectedRectangle) {
        return;
    }

    rectangles =
        rectangles.filter(
            r => r !== selectedRectangle
        );

    selectedRectangle =
        null;

    contextMenu.style.display =
        "none";

    requestDraw();
}

function clearRectangles() {
    rectangles = [];
    selectedRectangle = null;
    tempRectangle = null;

    outputs.style.display =
        "none";

    contextMenu.style.display =
        "none";

    requestDraw();
}

overlay.addEventListener(
    "mousedown",
    function(event) {
        if (mode === "normal") {
            return;
        }

        contextMenu.style.display =
            "none";

        const p =
            getPointer(event);

        if (mode === "rect") {
            drawing = true;

            startX = p.x;
            startY = p.y;

            tempRectangle = {
                x: p.x,
                y: p.y,
                width: 0,
                height: 0
            };

            requestDraw();

            return;
        }

        const rectangle =
            getRectangleAt(
                p.x,
                p.y
            );

        if (!rectangle) {
            selectedRectangle = null;
            requestDraw();
            return;
        }

        selectedRectangle =
            rectangle;

        const screen =
            processingToScreen(
                rectangle
            );

        const corner =
            getCorner(
                screen,
                p.x,
                p.y
            );

        if (corner) {
            resizing = true;

            resizeStartX = p.x;
            resizeStartY = p.y;

            resizeOriginal = {
                x: rectangle.x,
                y: rectangle.y,
                width: rectangle.width,
                height: rectangle.height
            };
        } else {
            dragging = true;

            dragOffsetX =
                p.x - screen.x;

            dragOffsetY =
                p.y - screen.y;
        }

        requestDraw();
    }
);

overlay.addEventListener(
    "mousemove",
    function(event) {
        if (mode === "normal") {
            return;
        }

        const p =
            getPointer(event);

        if (
            mode === "rect" &&
            drawing
        ) {
            tempRectangle =
                normalizeRectangle(
                    startX,
                    startY,
                    p.x,
                    p.y
                );

            const r =
                screenToProcessing(
                    tempRectangle
                );

            info.textContent =
                "X: " +
                Math.round(r.x) +
                "  Y: " +
                Math.round(r.y) +
                "  W: " +
                Math.round(r.width) +
                "  H: " +
                Math.round(r.height);

            requestDraw();

            return;
        }

        if (
            mode === "edit" &&
            selectedRectangle &&
            dragging
        ) {
            const screen =
                processingToScreen(
                    selectedRectangle
                );

            screen.x =
                p.x - dragOffsetX;

            screen.y =
                p.y - dragOffsetY;

            const converted =
                screenToProcessing(
                    screen
                );

            selectedRectangle.x =
                converted.x;

            selectedRectangle.y =
                converted.y;

            selectedRectangle.original =
                false;

            requestDraw();

            return;
        }

        if (
            mode === "edit" &&
            selectedRectangle &&
            resizing
        ) {
            const canvas =
                getCanvasInformation();

            const scaleX =
                canvas
                    ? canvasWidth /
                      canvas.width
                    : 1;

            const scaleY =
                canvas
                    ? canvasHeight /
                      canvas.height
                    : 1;

            const dx =
                p.x - resizeStartX;

            const dy =
                p.y - resizeStartY;

            selectedRectangle.x =
                resizeOriginal.x;

            selectedRectangle.y =
                resizeOriginal.y;

            selectedRectangle.width =
                Math.max(
                    2,
                    resizeOriginal.width +
                    dx * scaleX
                );

            selectedRectangle.height =
                Math.max(
                    2,
                    resizeOriginal.height +
                    dy * scaleY
                );

            selectedRectangle.original =
                false;

            requestDraw();
        }
    }
);

overlay.addEventListener(
    "mouseup",
    function(event) {
        if (mode === "normal") {
            return;
        }

        const p =
            getPointer(event);

        if (
            mode === "rect" &&
            drawing
        ) {
            drawing = false;

            const r =
                normalizeRectangle(
                    startX,
                    startY,
                    p.x,
                    p.y
                );

            tempRectangle = null;

            if (
                r.width >= 2 &&
                r.height >= 2
            ) {
                const converted =
                    screenToProcessing(
                        r
                    );

                rectangles.push({
                    x: converted.x,
                    y: converted.y,
                    width: converted.width,
                    height: converted.height,
                    originalX: converted.x,
                    originalY: converted.y,
                    originalWidth: converted.width,
                    originalHeight: converted.height,
                    original: false
                });
            }

            info.textContent =
                "Drag to create a rectangle";

            requestDraw();

            return;
        }

        dragging = false;
        resizing = false;
        resizeOriginal = null;

        requestDraw();
    }
);

overlay.addEventListener(
    "mouseleave",
    function() {
        if (
            mode === "rect" &&
            drawing
        ) {
            drawing = false;
            tempRectangle = null;
            requestDraw();
        }
    }
);

overlay.addEventListener(
    "contextmenu",
    function(event) {
        if (mode !== "edit") {
            return;
        }

        event.preventDefault();

        const p =
            getPointer(event);

        const rectangle =
            getRectangleAt(
                p.x,
                p.y
            );

        if (!rectangle) {
            contextMenu.style.display =
                "none";
            return;
        }

        selectedRectangle =
            rectangle;

        contextMenu.style.left =
            event.clientX + "px";

        contextMenu.style.top =
            event.clientY + "px";

        contextMenu.style.display =
            "block";

        requestDraw();
    }
);

document.addEventListener(
    "mousedown",
    function(event) {
        if (
            !contextMenu.contains(
                event.target
            )
        ) {
            contextMenu.style.display =
                "none";
        }
    }
);

duplicateButton.addEventListener(
    "click",
    duplicateRectangle
);

copyButton.addEventListener(
    "click",
    copyRectangle
);

cutButton.addEventListener(
    "click",
    cutRectangle
);

pasteButton.addEventListener(
    "click",
    pasteRectangle
);

deleteButton.addEventListener(
    "click",
    deleteRectangle
);

runButton.addEventListener(
    "click",
    runProgram
);

editButton.addEventListener(
    "click",
    editProgram
);

normalButton.addEventListener(
    "click",
    function() {
        setMode("normal");
    }
);

rectButton.addEventListener(
    "click",
    function() {
        setMode("rect");
    }
);

editRectButton.addEventListener(
    "click",
    function() {
        setMode("edit");
    }
);

printButton.addEventListener(
    "click",
    printRectangles
);

clearButton.addEventListener(
    "click",
    clearRectangles
);

widthInput.addEventListener(
    "change",
    function() {
        const size =
            getCanvasSize();

        canvasWidth =
            size.width;

        if (
            stage.style.display !==
            "none"
        ) {
            centerProgram();
        }
    }
);

heightInput.addEventListener(
    "change",
    function() {
        const size =
            getCanvasSize();

        canvasHeight =
            size.height;

        if (
            stage.style.display !==
            "none"
        ) {
            centerProgram();
        }
    }
);

window.addEventListener(
    "resize",
    function() {
        if (
            stage.style.display !==
            "none"
        ) {
            centerProgram();
        }
    }
);

editor.addEventListener(
    "keydown",
    function(event) {
        if (event.key !== "Tab") {
            return;
        }

        event.preventDefault();

        const start =
            editor.selectionStart;

        const end =
            editor.selectionEnd;

        editor.setRangeText(
            "    ",
            start,
            end,
            "end"
        );
    }
);

setMode("normal");
</script>
