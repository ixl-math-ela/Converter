<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouse Rectangle Tool</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, rgba(38, 132, 255, 0.18), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.18), transparent 35%),
        linear-gradient(135deg, #080d1a, #101a32 50%, #080d1a);
}

button {
    font-family: inherit;
}

#toolbar {
    height: 72px;
    width: 100%;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 9px;
    position: relative;
    z-index: 100;
    background: rgba(8, 13, 26, 0.86);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-right: 12px;
}

.brandIcon {
    width: 43px;
    height: 43px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2684ff, #7357ff);
    box-shadow: 0 9px 28px rgba(38, 132, 255, 0.28);
    font-size: 21px;
    font-weight: bold;
}

.brandTitle {
    font-size: 16px;
    font-weight: bold;
}

.brandSubtitle {
    margin-top: 2px;
    color: #7786a2;
    font-size: 11px;
}

.group {
    display: flex;
    align-items: center;
    gap: 7px;
}

.spacer {
    flex: 1;
}

button {
    padding: 10px 14px;
    border-radius: 11px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #dce7fb;
    background: rgba(255, 255, 255, 0.055);
    cursor: pointer;
    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

button:hover {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(100, 170, 255, 0.5);
}

button.active,
#runButton {
    color: white;
    background: linear-gradient(135deg, #2684ff, #4f6cff);
    border-color: rgba(130, 190, 255, 0.7);
    box-shadow: 0 8px 25px rgba(38, 132, 255, 0.25);
}

#editor {
    position: absolute;
    top: 72px;
    left: 0;
    width: 100%;
    height: calc(100% - 72px);
    margin: 0;
    padding: 25px;
    border: 0;
    outline: 0;
    resize: none;
    background: rgba(5, 9, 19, 0.96);
    color: #dce7fb;
    font: 14px/1.65 Consolas, Monaco, monospace;
}

#stage {
    position: absolute;
    top: 72px;
    left: 0;
    width: 100%;
    height: calc(100% - 72px);
    display: none;
    overflow: hidden;
}

#program {
    position: absolute;
    width: 400px;
    height: 400px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 0;
    background: white;
    z-index: 1;
}

#overlay {
    position: absolute;
    width: 400px;
    height: 400px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
}

#info {
    position: absolute;
    top: 18px;
    right: 18px;
    min-width: 230px;
    padding: 12px 15px;
    border-radius: 14px;
    display: none;
    background: rgba(8, 13, 26, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #dce7fb;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    font: 12px/1.6 Consolas, monospace;
    z-index: 30;
}

#editBadge {
    position: absolute;
    left: 18px;
    top: 18px;
    padding: 9px 13px;
    border-radius: 12px;
    display: none;
    background: rgba(38, 132, 255, 0.18);
    border: 1px solid rgba(100, 170, 255, 0.4);
    color: #9acbff;
    font-size: 12px;
    z-index: 30;
    pointer-events: none;
}

#output {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 18px;
    width: calc(100% - 36px);
    height: 220px;
    padding: 16px;
    display: none;
    resize: vertical;
    outline: 0;
    border-radius: 17px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(8, 13, 26, 0.96);
    color: #b9e3ff;
    box-shadow: 0 20px 55px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    font: 13px/1.6 Consolas, monospace;
    z-index: 200;
}

#contextMenu {
    position: fixed;
    min-width: 180px;
    padding: 7px;
    display: none;
    border-radius: 14px;
    background: rgba(11, 17, 33, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.13);
    box-shadow: 0 20px 55px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 500;
}

.contextButton {
    width: 100%;
    padding: 10px 12px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: #dce7fb;
    text-align: left;
    font-size: 13px;
}

.contextButton:hover {
    transform: none;
    background: rgba(38, 132, 255, 0.18);
    border: 0;
}

.deleteButton {
    color: #ff9eae;
}

@media (max-width: 900px) {
    .brandText {
        display: none;
    }

    .brand {
        margin-right: 0;
    }

    #toolbar {
        padding: 9px;
    }

    button {
        padding: 9px 11px;
    }
}

@media (max-width: 650px) {
    .brand {
        display: none;
    }

    #toolbar {
        overflow-x: auto;
    }

    .spacer {
        display: none;
    }
}
</style>
</head>

<body>

<div id="toolbar">

    <div class="brand">
        <div class="brandIcon">▣</div>
        <div class="brandText">
            <div class="brandTitle">Mouse Rectangle Tool</div>
            <div class="brandSubtitle">ProcessingJS / Khan Academy</div>
        </div>
    </div>

    <div class="group">
        <button id="runButton">▶ Run</button>
        <button id="editCodeButton">Code</button>
    </div>

    <div class="group">
        <button id="normalButton" class="active">Normal</button>
        <button id="rectButton">Draw</button>
        <button id="editModeButton">Edit</button>
    </div>

    <div class="spacer"></div>

    <div class="group">
        <button id="printButton">Copy Code</button>
        <button id="clearButton">Clear</button>
    </div>

</div>

<textarea id="editor" spellcheck="false">size(400, 400);
background(220);

fill(255, 0, 0);
rect(20, 120, 340, 45);

fill(0, 0, 255);
rect(20, 170, 340, 45);

if (mouseX > 20 && mouseX < 360 && mouseY > 120 && mouseY < 165) {
    fill(0);
    text("Red button", 130, 145);
}

if (mouseX > 20 && mouseX < 360 && mouseY > 170 && mouseY < 215) {
    fill(0);
    text("Blue button", 130, 195);
}</textarea>

<div id="stage">

    <iframe
        id="program"
        sandbox="allow-scripts allow-same-origin allow-forms">
    </iframe>

    <canvas id="overlay"></canvas>

    <div id="info"></div>

    <div id="editBadge">
        Edit Mode · Drag to move · Drag handles to resize · Right-click for options
    </div>

</div>

<textarea id="output" readonly></textarea>

<div id="contextMenu">
    <button class="contextButton" id="duplicateButton">Duplicate</button>
    <button class="contextButton" id="cutButton">Cut</button>
    <button class="contextButton" id="copyButton">Copy</button>
    <button class="contextButton" id="pasteButton">Paste</button>
    <button class="contextButton deleteButton" id="deleteButton">Delete</button>
</div>

<script>
const editor = document.getElementById("editor");
const stage = document.getElementById("stage");
const program = document.getElementById("program");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");

const info = document.getElementById("info");
const output = document.getElementById("output");
const editBadge = document.getElementById("editBadge");
const contextMenu = document.getElementById("contextMenu");

const runButton = document.getElementById("runButton");
const editCodeButton = document.getElementById("editCodeButton");
const normalButton = document.getElementById("normalButton");
const rectButton = document.getElementById("rectButton");
const editModeButton = document.getElementById("editModeButton");
const printButton = document.getElementById("printButton");
const clearButton = document.getElementById("clearButton");

const duplicateButton = document.getElementById("duplicateButton");
const cutButton = document.getElementById("cutButton");
const copyButton = document.getElementById("copyButton");
const pasteButton = document.getElementById("pasteButton");
const deleteButton = document.getElementById("deleteButton");

const PROCESSING_WIDTH = 400;
const PROCESSING_HEIGHT = 400;

let mode = "normal";

let rectangles = [];
let selectedRectangle = -1;
let contextRectangle = -1;
let clipboardRectangle = null;

let drawing = false;
let startX = 0;
let startY = 0;

let editing = false;
let editAction = "";
let resizeHandle = "";

let dragOffsetX = 0;
let dragOffsetY = 0;

function isFullHTML(code) {
    return (
        /<html[\s>]/i.test(code) ||
        /<script[\s>]/i.test(code) ||
        /<!doctype/i.test(code)
    );
}

function createProcessingHTML(source) {
    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ProcessingJS Program</title>
</head>

<body style="margin:0;overflow:hidden;background:white;">

<canvas id="mycanvas"></canvas>

<script src="https://cdn.jsdelivr.net/processing.js/1.4.8/processing.min.js"><\/script>

<script>
var programCode = function(processingInstance) {
    with (processingInstance) {
        size(400, 400);
        frameRate(30);

        ${source}
    }
};

var canvas = document.getElementById("mycanvas");

var processingInstance =
    new Processing(canvas, programCode);
<\/script>

</body>
</html>`;
}

function getProgramHTML() {
    const source = editor.value.trim();

    if (isFullHTML(source)) {
        return source;
    }

    return createProcessingHTML(source);
}

function getCanvasInformation() {
    try {
        const iframeRect =
            program.getBoundingClientRect();

        const canvas =
            program.contentDocument.querySelector("canvas");

        if (!canvas) {
            return null;
        }

        const canvasRect =
            canvas.getBoundingClientRect();

        return {
            x: canvasRect.left - iframeRect.left,
            y: canvasRect.top - iframeRect.top,
            width: canvasRect.width,
            height: canvasRect.height
        };
    } catch {
        return null;
    }
}

function getOverlayPoint(event) {
    const bounds =
        overlay.getBoundingClientRect();

    return {
        x: event.clientX - bounds.left,
        y: event.clientY - bounds.top
    };
}

function normalizeRectangle(x1, y1, x2, y2) {
    return {
        x: Math.min(x1, x2),
        y: Math.min(y1, y2),
        width: Math.abs(x2 - x1),
        height: Math.abs(y2 - y1)
    };
}

function processingToScreen(rectangle) {
    const canvas =
        getCanvasInformation();

    if (!canvas) {
        return {
            x: rectangle.x,
            y: rectangle.y,
            width: rectangle.width,
            height: rectangle.height
        };
    }

    return {
        x:
            canvas.x +
            rectangle.x *
            (canvas.width / PROCESSING_WIDTH),

        y:
            canvas.y +
            rectangle.y *
            (canvas.height / PROCESSING_HEIGHT),

        width:
            rectangle.width *
            (canvas.width / PROCESSING_WIDTH),

        height:
            rectangle.height *
            (canvas.height / PROCESSING_HEIGHT)
    };
}

function screenToProcessing(rectangle) {
    const canvas =
        getCanvasInformation();

    if (!canvas) {
        return rectangle;
    }

    return {
        x:
            (rectangle.x - canvas.x) *
            (PROCESSING_WIDTH / canvas.width),

        y:
            (rectangle.y - canvas.y) *
            (PROCESSING_HEIGHT / canvas.height),

        width:
            rectangle.width *
            (PROCESSING_WIDTH / canvas.width),

        height:
            rectangle.height *
            (PROCESSING_HEIGHT / canvas.height)
    };
}

function rectangleEquals(a, b) {
    const tolerance = 1;

    return (
        Math.abs(a.x - b.x) <= tolerance &&
        Math.abs(a.y - b.y) <= tolerance &&
        Math.abs(a.width - b.width) <= tolerance &&
        Math.abs(a.height - b.height) <= tolerance
    );
}

function drawResizeHandles(rectangle) {
    const size = 9;

    const handles = [
        [rectangle.x, rectangle.y],
        [
            rectangle.x + rectangle.width / 2,
            rectangle.y
        ],
        [
            rectangle.x + rectangle.width,
            rectangle.y
        ],
        [
            rectangle.x,
            rectangle.y + rectangle.height / 2
        ],
        [
            rectangle.x + rectangle.width,
            rectangle.y + rectangle.height / 2
        ],
        [
            rectangle.x,
            rectangle.y + rectangle.height
        ],
        [
            rectangle.x + rectangle.width / 2,
            rectangle.y + rectangle.height
        ],
        [
            rectangle.x + rectangle.width,
            rectangle.y + rectangle.height
        ]
    ];

    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#2684ff";
    ctx.lineWidth = 2;

    for (const point of handles) {
        ctx.fillRect(
            point[0] - size / 2,
            point[1] - size / 2,
            size,
            size
        );

        ctx.strokeRect(
            point[0] - size / 2,
            point[1] - size / 2,
            size,
            size
        );
    }
}

function drawRectangles(tempRectangle = null) {
    ctx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );

    for (let i = 0; i < rectangles.length; i++) {
        const rectangle =
            rectangles[i];

        if (rectangle.visible === false) {
            continue;
        }

        if (rectangle.category === "original") {
            ctx.fillStyle =
                i === selectedRectangle
                    ? "rgba(38, 132, 255, 0.28)"
                    : "rgba(38, 132, 255, 0.13)";

            ctx.strokeStyle =
                i === selectedRectangle
                    ? "#6fb4ff"
                    : "rgba(38, 132, 255, 0.75)";
        }

        if (rectangle.category === "updated") {
            ctx.fillStyle =
                i === selectedRectangle
                    ? "rgba(139, 92, 246, 0.30)"
                    : "rgba(139, 92, 246, 0.14)";

            ctx.strokeStyle =
                i === selectedRectangle
                    ? "#c4a7ff"
                    : "rgba(139, 92, 246, 0.8)";
        }

        if (rectangle.category === "new") {
            ctx.fillStyle =
                i === selectedRectangle
                    ? "rgba(34, 197, 94, 0.30)"
                    : "rgba(34, 197, 94, 0.14)";

            ctx.strokeStyle =
                i === selectedRectangle
                    ? "#7bea9d"
                    : "rgba(34, 197, 94, 0.8)";
        }

        ctx.lineWidth =
            i === selectedRectangle
                ? 3
                : 2;

        ctx.fillRect(
            rectangle.x,
            rectangle.y,
            rectangle.width,
            rectangle.height
        );

        ctx.strokeRect(
            rectangle.x,
            rectangle.y,
            rectangle.width,
            rectangle.height
        );

        if (
            mode === "edit" &&
            i === selectedRectangle
        ) {
            drawResizeHandles(rectangle);
        }
    }

    if (tempRectangle) {
        ctx.fillStyle =
            "rgba(34, 197, 94, 0.18)";

        ctx.strokeStyle =
            "#22c55e";

        ctx.lineWidth = 2;

        ctx.fillRect(
            tempRectangle.x,
            tempRectangle.y,
            tempRectangle.width,
            tempRectangle.height
        );

        ctx.strokeRect(
            tempRectangle.x,
            tempRectangle.y,
            tempRectangle.width,
            tempRectangle.height
        );
    }
}

function getResizeHandle(x, y, rectangle) {
    const size = 14;

    const handles = {
        nw: [rectangle.x, rectangle.y],

        n: [
            rectangle.x + rectangle.width / 2,
            rectangle.y
        ],

        ne: [
            rectangle.x + rectangle.width,
            rectangle.y
        ],

        w: [
            rectangle.x,
            rectangle.y + rectangle.height / 2
        ],

        e: [
            rectangle.x + rectangle.width,
            rectangle.y + rectangle.height / 2
        ],

        sw: [
            rectangle.x,
            rectangle.y + rectangle.height
        ],

        s: [
            rectangle.x + rectangle.width / 2,
            rectangle.y + rectangle.height
        ],

        se: [
            rectangle.x + rectangle.width,
            rectangle.y + rectangle.height
        ]
    };

    for (const [name, point] of Object.entries(handles)) {
        if (
            Math.abs(x - point[0]) <= size &&
            Math.abs(y - point[1]) <= size
        ) {
            return name;
        }
    }

    return "";
}

function pointInsideRectangle(x, y, rectangle) {
    return (
        x >= rectangle.x &&
        x <= rectangle.x + rectangle.width &&
        y >= rectangle.y &&
        y <= rectangle.y + rectangle.height
    );
}

function getRectangleAt(x, y) {
    for (
        let i = rectangles.length - 1;
        i >= 0;
        i--
    ) {
        if (
            rectangles[i].visible !== false &&
            pointInsideRectangle(
                x,
                y,
                rectangles[i]
            )
        ) {
            return i;
        }
    }

    return -1;
}

function updateCursor(x, y) {
    if (mode !== "edit") {
        overlay.style.cursor = "default";
        return;
    }

    if (selectedRectangle >= 0) {
        const handle =
            getResizeHandle(
                x,
                y,
                rectangles[selectedRectangle]
            );

        const cursors = {
            nw: "nwse-resize",
            n: "ns-resize",
            ne: "nesw-resize",
            w: "ew-resize",
            e: "ew-resize",
            sw: "nesw-resize",
            s: "ns-resize",
            se: "nwse-resize"
        };

        if (handle) {
            overlay.style.cursor =
                cursors[handle];

            return;
        }
    }

    const index =
        getRectangleAt(x, y);

    overlay.style.cursor =
        index >= 0
            ? "move"
            : "default";
}

function extractRange(condition, axis) {
    const variable =
        axis === "x"
            ? "mouseX"
            : "mouseY";

    const escaped =
        variable;

    let low = null;
    let high = null;

    const patterns = [
        new RegExp(
            escaped +
            "\\s*>\\s*(-?\\d+(?:\\.\\d+)?)",
            "i"
        ),

        new RegExp(
            escaped +
            "\\s*>=\\s*(-?\\d+(?:\\.\\d+)?)",
            "i"
        )
    ];

    const upperPatterns = [
        new RegExp(
            escaped +
            "\\s*<\\s*(-?\\d+(?:\\.\\d+)?)",
            "i"
        ),

        new RegExp(
            escaped +
            "\\s*<=\\s*(-?\\d+(?:\\.\\d+)?)",
            "i"
        )
    ];

    for (const pattern of patterns) {
        const match =
            condition.match(pattern);

        if (match) {
            low = Number(match[1]);
            break;
        }
    }

    for (const pattern of upperPatterns) {
        const match =
            condition.match(pattern);

        if (match) {
            high = Number(match[1]);
            break;
        }
    }

    const reverseLowPatterns = [
        new RegExp(
            "(-?\\d+(?:\\.\\d+)?)\\s*<\\s*" +
            escaped,
            "i"
        ),

        new RegExp(
            "(-?\\d+(?:\\.\\d+)?)\\s*<=\\s*" +
            escaped,
            "i"
        )
    ];

    const reverseHighPatterns = [
        new RegExp(
            "(-?\\d+(?:\\.\\d+)?)\\s*>\\s*" +
            escaped,
            "i"
        ),

        new RegExp(
            "(-?\\d+(?:\\.\\d+)?)\\s*>=\\s*" +
            escaped,
            "i"
        )
    ];

    if (low === null) {
        for (const pattern of reverseLowPatterns) {
            const match =
                condition.match(pattern);

            if (match) {
                low = Number(match[1]);
                break;
            }
        }
    }

    if (high === null) {
        for (const pattern of reverseHighPatterns) {
            const match =
                condition.match(pattern);

            if (match) {
                high = Number(match[1]);
                break;
            }
        }
    }

    if (
        low === null ||
        high === null ||
        high <= low
    ) {
        return null;
    }

    return {
        low,
        high
    };
}

function getMouseConditions(source) {
    const results = [];

    const cleaned =
        source
            .replace(/\r/g, "")
            .replace(
                /\/\*[\s\S]*?\*\//g,
                ""
            );

    const ifRegex =
        /if\s*\(([\s\S]*?)\)\s*\{/gi;

    let match;

    while (
        (match = ifRegex.exec(cleaned)) !== null
    ) {
        const condition =
            match[1];

        const xRange =
            extractRange(
                condition,
                "x"
            );

        const yRange =
            extractRange(
                condition,
                "y"
            );

        if (!xRange || !yRange) {
            continue;
        }

        const rectangle = {
            x: xRange.low,
            y: yRange.low,
            width:
                xRange.high -
                xRange.low,
            height:
                yRange.high -
                yRange.low
        };

        const mouseText =
            /mouseX|mouseY/i.test(condition);

        if (!mouseText) {
            continue;
        }

        results.push({
            rectangle,
            condition,
            sourceIndex: results.length
        });
    }

    return results;
}

function detectOriginalRectangles() {
    const conditions =
        getMouseConditions(
            editor.value
        );

    const detected =
        conditions.map(item => {
            const screen =
                processingToScreen(
                    item.rectangle
                );

            return {
                x: screen.x,
                y: screen.y,
                width: screen.width,
                height: screen.height,
                category: "original",
                originalRectangle: {
                    x: screen.x,
                    y: screen.y,
                    width: screen.width,
                    height: screen.height
                },
                originalCondition:
                    item.condition,
                visible: true
            };
        });

    rectangles = detected;
    selectedRectangle = -1;

    updateOriginalVisibility();
    drawRectangles();
}

function updateOriginalVisibility() {
    for (const rectangle of rectangles) {
        if (
            rectangle.category !== "original" &&
            rectangle.category !== "updated"
        ) {
            continue;
        }

        rectangle.visible = true;
    }
}

function createMouseCondition(rectangle) {
    const r =
        screenToProcessing(
            rectangle
        );

    const x1 =
        Math.round(r.x);

    const y1 =
        Math.round(r.y);

    const x2 =
        Math.round(
            r.x + r.width
        );

    const y2 =
        Math.round(
            r.y + r.height
        );

    return `if (mouseX > ${x1} && mouseX < ${x2} && mouseY > ${y1} && mouseY < ${y2}) {

}`;
}

function getCategory(rectangle) {
    if (rectangle.category === "new") {
        return "new";
    }

    if (
        rectangle.originalRectangle &&
        rectangleEquals(
            rectangle,
            rectangle.originalRectangle
        )
    ) {
        return "original";
    }

    return "updated";
}

function prepareOutput() {
    const original = [];
    const updated = [];
    const added = [];

    for (const rectangle of rectangles) {
        const category =
            getCategory(rectangle);

        if (category === "original") {
            original.push(
                createMouseCondition(
                    rectangle
                )
            );
        }

        if (category === "updated") {
            updated.push(
                createMouseCondition(
                    rectangle
                )
            );
        }

        if (category === "new") {
            added.push(
                createMouseCondition(
                    rectangle
                )
            );
        }
    }

    const sections = [];

    sections.push(
        "===== ORIGINAL MOUSE CONDITIONS =====\n\n" +
        (
            original.length
                ? original.join("\n\n")
                : "None"
        )
    );

    sections.push(
        "===== UPDATED ORIGINAL MOUSE CONDITIONS =====\n\n" +
        (
            updated.length
                ? updated.join("\n\n")
                : "None"
        )
    );

    sections.push(
        "===== NEW MOUSE CONDITIONS =====\n\n" +
        (
            added.length
                ? added.join("\n\n")
                : "None"
        )
    );

    return sections.join(
        "\n\n\n"
    );
}

function runProgram() {
    closeContextMenu();

    program.srcdoc =
        getProgramHTML();

    editor.style.display = "none";
    stage.style.display = "block";
    output.style.display = "none";

    setMode("normal");

    setTimeout(
        function() {
            resizeOverlay();

            detectOriginalRectangles();

            setTimeout(
                function() {
                    resizeOverlay();
                    updateOriginalVisibility();
                    drawRectangles();
                },
                500
            );
        },
        400
    );
}

function editProgram() {
    closeContextMenu();

    stage.style.display = "none";
    editor.style.display = "block";
    output.style.display = "none";
}

function setMode(newMode) {
    mode = newMode;

    normalButton.classList.toggle(
        "active",
        mode === "normal"
    );

    rectButton.classList.toggle(
        "active",
        mode === "rect"
    );

    editModeButton.classList.toggle(
        "active",
        mode === "edit"
    );

    if (mode === "normal") {
        overlay.style.pointerEvents = "none";
        overlay.style.cursor = "default";
        info.style.display = "none";
        editBadge.style.display = "none";
    }

    if (mode === "rect") {
        overlay.style.pointerEvents = "auto";
        overlay.style.cursor = "crosshair";
        info.style.display = "block";
        editBadge.style.display = "none";

        info.textContent =
            "Drag to create a new mouse rectangle";
    }

    if (mode === "edit") {
        overlay.style.pointerEvents = "auto";
        overlay.style.cursor = "default";
        info.style.display = "none";
        editBadge.style.display = "block";
    }

    drawRectangles();
}

function resizeOverlay() {
    const width =
        program.getBoundingClientRect().width;

    const height =
        program.getBoundingClientRect().height;

    overlay.width =
        Math.round(width);

    overlay.height =
        Math.round(height);

    overlay.style.width =
        width + "px";

    overlay.style.height =
        height + "px";

    drawRectangles();
}

function resizeRectangle(
    rectangle,
    x,
    y
) {
    const minimum = 5;

    const right =
        rectangle.x +
        rectangle.width;

    const bottom =
        rectangle.y +
        rectangle.height;

    if (resizeHandle.includes("w")) {
        const newX =
            Math.min(
                x,
                right - minimum
            );

        rectangle.width =
            right - newX;

        rectangle.x =
            newX;
    }

    if (resizeHandle.includes("e")) {
        rectangle.width =
            Math.max(
                minimum,
                x - rectangle.x
            );
    }

    if (resizeHandle.includes("n")) {
        const newY =
            Math.min(
                y,
                bottom - minimum
            );

        rectangle.height =
            bottom - newY;

        rectangle.y =
            newY;
    }

    if (resizeHandle.includes("s")) {
        rectangle.height =
            Math.max(
                minimum,
                y - rectangle.y
            );
    }
}

overlay.addEventListener(
    "mousedown",
    function(event) {
        if (event.button !== 0) {
            return;
        }

        const point =
            getOverlayPoint(event);

        if (mode === "rect") {
            startX = point.x;
            startY = point.y;
            drawing = true;
            return;
        }

        if (mode !== "edit") {
            return;
        }

        selectedRectangle =
            getRectangleAt(
                point.x,
                point.y
            );

        if (selectedRectangle < 0) {
            drawRectangles();
            return;
        }

        const rectangle =
            rectangles[
                selectedRectangle
            ];

        resizeHandle =
            getResizeHandle(
                point.x,
                point.y,
                rectangle
            );

        if (resizeHandle) {
            editAction = "resize";
        } else {
            editAction = "move";

            dragOffsetX =
                point.x -
                rectangle.x;

            dragOffsetY =
                point.y -
                rectangle.y;
        }

        editing = true;

        drawRectangles();
    }
);

overlay.addEventListener(
    "mousemove",
    function(event) {
        const point =
            getOverlayPoint(event);

        if (
            mode === "rect" &&
            drawing
        ) {
            const rectangle =
                normalizeRectangle(
                    startX,
                    startY,
                    point.x,
                    point.y
                );

            const processing =
                screenToProcessing(
                    rectangle
                );

            info.textContent =
                "X: " +
                Math.round(processing.x) +
                "   Y: " +
                Math.round(processing.y) +
                "   W: " +
                Math.round(processing.width) +
                "   H: " +
                Math.round(processing.height);

            drawRectangles(
                rectangle
            );

            return;
        }

        if (
            mode === "edit" &&
            editing &&
            selectedRectangle >= 0
        ) {
            const rectangle =
                rectangles[
                    selectedRectangle
                ];

            if (editAction === "move") {
                rectangle.x =
                    point.x -
                    dragOffsetX;

                rectangle.y =
                    point.y -
                    dragOffsetY;
            }

            if (editAction === "resize") {
                resizeRectangle(
                    rectangle,
                    point.x,
                    point.y
                );
            }

            drawRectangles();
            return;
        }

        updateCursor(
            point.x,
            point.y
        );
    }
);

overlay.addEventListener(
    "mouseup",
    function(event) {
        if (
            mode === "rect" &&
            drawing
        ) {
            const point =
                getOverlayPoint(event);

            const rectangle =
                normalizeRectangle(
                    startX,
                    startY,
                    point.x,
                    point.y
                );

            drawing = false;

            if (
                rectangle.width >= 4 &&
                rectangle.height >= 4
            ) {
                rectangles.push({
                    x: rectangle.x,
                    y: rectangle.y,
                    width: rectangle.width,
                    height: rectangle.height,
                    category: "new",
                    visible: true
                });

                selectedRectangle =
                    rectangles.length - 1;
            }

            drawRectangles();

            return;
        }

        if (mode === "edit") {
            editing = false;
            editAction = "";
            resizeHandle = "";

            if (selectedRectangle >= 0) {
                const rectangle =
                    rectangles[
                        selectedRectangle
                    ];

                if (
                    rectangle.category ===
                    "original"
                ) {
                    if (
                        !rectangleEquals(
                            rectangle,
                            rectangle.originalRectangle
                        )
                    ) {
                        rectangle.category =
                            "updated";
                    }
                }
            }

            drawRectangles();
        }
    }
);

overlay.addEventListener(
    "mouseleave",
    function() {
        if (drawing) {
            drawing = false;
            drawRectangles();
        }

        editing = false;
        editAction = "";
        resizeHandle = "";
    }
);

overlay.addEventListener(
    "contextmenu",
    function(event) {
        if (mode !== "edit") {
            return;
        }

        event.preventDefault();

        const point =
            getOverlayPoint(event);

        const index =
            getRectangleAt(
                point.x,
                point.y
            );

        if (index < 0) {
            closeContextMenu();
            return;
        }

        selectedRectangle = index;
        contextRectangle = index;

        drawRectangles();

        openContextMenu(
            event.clientX,
            event.clientY
        );
    }
);

function openContextMenu(
    x,
    y
) {
    contextMenu.style.display =
        "block";

    const width =
        contextMenu.offsetWidth;

    const height =
        contextMenu.offsetHeight;

    contextMenu.style.left =
        Math.min(
            x,
            window.innerWidth -
            width -
            8
        ) + "px";

    contextMenu.style.top =
        Math.min(
            y,
            window.innerHeight -
            height -
            8
        ) + "px";
}

function closeContextMenu() {
    contextMenu.style.display =
        "none";

    contextRectangle = -1;
}

function duplicateRectangle(index) {
    if (
        index < 0 ||
        index >= rectangles.length
    ) {
        return;
    }

    const source =
        rectangles[index];

    const copy = {
        x: source.x + 15,
        y: source.y + 15,
        width: source.width,
        height: source.height,
        category: "new",
        visible: true
    };

    rectangles.splice(
        index + 1,
        0,
        copy
    );

    selectedRectangle =
        index + 1;

    drawRectangles();
}

function copyRectangle(index) {
    if (
        index < 0 ||
        index >= rectangles.length
    ) {
        return;
    }

    const source =
        rectangles[index];

    clipboardRectangle = {
        x: source.x,
        y: source.y,
        width: source.width,
        height: source.height
    };
}

function cutRectangle(index) {
    if (
        index < 0 ||
        index >= rectangles.length
    ) {
        return;
    }

    copyRectangle(index);

    rectangles.splice(
        index,
        1
    );

    selectedRectangle = -1;

    drawRectangles();
}

function pasteRectangle() {
    if (!clipboardRectangle) {
        return;
    }

    const copy = {
        x:
            clipboardRectangle.x +
            15,

        y:
            clipboardRectangle.y +
            15,

        width:
            clipboardRectangle.width,

        height:
            clipboardRectangle.height,

        category: "new",

        visible: true
    };

    rectangles.push(copy);

    selectedRectangle =
        rectangles.length - 1;

    drawRectangles();
}

function deleteRectangle(index) {
    if (
        index < 0 ||
        index >= rectangles.length
    ) {
        return;
    }

    rectangles.splice(
        index,
        1
    );

    selectedRectangle = -1;

    drawRectangles();
}

duplicateButton.addEventListener(
    "click",
    function() {
        duplicateRectangle(
            contextRectangle
        );

        closeContextMenu();
    }
);

cutButton.addEventListener(
    "click",
    function() {
        cutRectangle(
            contextRectangle
        );

        closeContextMenu();
    }
);

copyButton.addEventListener(
    "click",
    function() {
        copyRectangle(
            contextRectangle
        );

        closeContextMenu();
    }
);

pasteButton.addEventListener(
    "click",
    function() {
        pasteRectangle();
        closeContextMenu();
    }
);

deleteButton.addEventListener(
    "click",
    function() {
        deleteRectangle(
            contextRectangle
        );

        closeContextMenu();
    }
);

document.addEventListener(
    "mousedown",
    function(event) {
        if (
            !contextMenu.contains(
                event.target
            )
        ) {
            closeContextMenu();
        }
    }
);

document.addEventListener(
    "keydown",
    function(event) {
        if (mode !== "edit") {
            return;
        }

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "c"
        ) {
            if (selectedRectangle >= 0) {
                copyRectangle(
                    selectedRectangle
                );

                event.preventDefault();
            }
        }

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "x"
        ) {
            if (selectedRectangle >= 0) {
                cutRectangle(
                    selectedRectangle
                );

                event.preventDefault();
            }
        }

        if (
            event.ctrlKey &&
            event.key.toLowerCase() === "v"
        ) {
            pasteRectangle();
            event.preventDefault();
        }

        if (
            event.key === "Delete" &&
            selectedRectangle >= 0
        ) {
            deleteRectangle(
                selectedRectangle
            );

            event.preventDefault();
        }

        if (event.key === "Escape") {
            closeContextMenu();
        }
    }
);

printButton.addEventListener(
    "click",
    async function() {
        const result =
            prepareOutput();

        output.value =
            result;

        output.style.display =
            "block";

        try {
            await navigator.clipboard.writeText(
                result
            );

            printButton.textContent =
                "Copied!";

            setTimeout(
                function() {
                    printButton.textContent =
                        "Copy Code";
                },
                1200
            );
        } catch {
            output.select();
        }
    }
);

clearButton.addEventListener(
    "click",
    function() {
        rectangles = [];
        selectedRectangle = -1;
        output.value = "";
        output.style.display = "none";
        drawRectangles();
    }
);

runButton.addEventListener(
    "click",
    runProgram
);

editCodeButton.addEventListener(
    "click",
    editProgram
);

normalButton.addEventListener(
    "click",
    function() {
        setMode("normal");
    }
);

rectButton.addEventListener(
    "click",
    function() {
        setMode("rect");
    }
);

editModeButton.addEventListener(
    "click",
    function() {
        setMode("edit");
    }
);

program.addEventListener(
    "load",
    function() {
        setTimeout(
            function() {
                resizeOverlay();
                detectOriginalRectangles();
            },
            150
        );
    }
);

window.addEventListener(
    "resize",
    function() {
        resizeOverlay();
    }
);

setMode("normal");
</script>

</body>
</html>
