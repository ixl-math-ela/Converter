<script>
const editor =
    document.getElementById("editor");

const stage =
    document.getElementById("stage");

const program =
    document.getElementById("program");

const overlay =
    document.getElementById("overlay");

const ctx =
    overlay.getContext("2d");

const info =
    document.getElementById("info");

const editPanel =
    document.getElementById("editPanel");

const outputPanel =
    document.getElementById("outputPanel");

const contextMenu =
    document.getElementById("contextMenu");

const originalSection =
    document.getElementById("originalSection");

const updatedSection =
    document.getElementById("updatedSection");

const newSection =
    document.getElementById("newSection");

const originalOutput =
    document.getElementById("originalOutput");

const updatedOutput =
    document.getElementById("updatedOutput");

const newOutput =
    document.getElementById("newOutput");

const runButton =
    document.getElementById("runButton");

const editButton =
    document.getElementById("editButton");

const normalButton =
    document.getElementById("normalButton");

const rectButton =
    document.getElementById("rectButton");

const editRectsButton =
    document.getElementById("editRectsButton");

const printButton =
    document.getElementById("printButton");

const clearButton =
    document.getElementById("clearButton");

const widthInput =
    document.getElementById("widthInput");

const heightInput =
    document.getElementById("heightInput");

let mode = "normal";

let rectangles = [];

let selectedRectangle = -1;

let contextRectangle = -1;

let clipboardRectangle = null;

let drawing = false;

let startX = 0;

let startY = 0;

let editing = false;

let editAction = "";

let resizeHandle = "";

let dragOffsetX = 0;

let dragOffsetY = 0;

editor.value = `background(220);

fill(255, 0, 0);
rect(20, 120, 340, 45);

fill(0, 0, 255);
rect(20, 170, 340, 45);`;

function getProgramWidth() {
    const value =
        Number(widthInput.value);

    return value > 0 ? value : 400;
}

function getProgramHeight() {
    const value =
        Number(heightInput.value);

    return value > 0 ? value : 400;
}

function hasSizeCall(code) {
    return /\bsize\s*\(/.test(code);
}

function isFullHTML(code) {
    return (
        /<!doctype/i.test(code) ||
        /<html[\s>]/i.test(code)
    );
}

function createProcessingHTML(source) {
    const width =
        getProgramWidth();

    const height =
        getProgramHeight();

    const sizeCode =
        hasSizeCall(source)
            ? ""
            : `size(${width}, ${height});`;

    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ProcessingJS Program</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: ${width}px;
    height: ${height}px;
    overflow: hidden;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<canvas
    id="mycanvas"
    width="${width}"
    height="${height}">
</canvas>

<script src="https://cdn.jsdelivr.net/processing.js/1.4.8/processing.min.js"><\/script>

<script>
var programCode = function(processingInstance) {

    with (processingInstance) {

        ${sizeCode}

        ${source}

    }

};

var canvas =
    document.getElementById("mycanvas");

var processingInstance =
    new Processing(
        canvas,
        programCode
    );

<\/script>

</body>
</html>`;
}

function normalizeRectangle(
    x1,
    y1,
    x2,
    y2
) {
    return {
        x: Math.min(x1, x2),
        y: Math.min(y1, y2),
        width: Math.abs(x2 - x1),
        height: Math.abs(y2 - y1)
    };
}

function extractCoordinateRange(
    condition,
    variable
) {
    const escaped =
        variable.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
        );

    const greaterPattern =
        new RegExp(
            escaped +
            "\\s*(?:>|>=)\\s*(-?\\d+(?:\\.\\d+)?)"
        );

    const lessPattern =
        new RegExp(
            escaped +
            "\\s*(?:<|<=)\\s*(-?\\d+(?:\\.\\d+)?)"
        );

    const greaterReversePattern =
        new RegExp(
            "(-?\\d+(?:\\.\\d+)?)\\s*(?:<|<=)\\s*" +
            escaped
        );

    const lessReversePattern =
        new RegExp(
            "(-?\\d+(?:\\.\\d+)?)\\s*(?:>|>=)\\s*" +
            escaped
        );

    let min = null;

    let max = null;

    const greater =
        condition.match(
            greaterPattern
        );

    const less =
        condition.match(
            lessPattern
        );

    const greaterReverse =
        condition.match(
            greaterReversePattern
        );

    const lessReverse =
        condition.match(
            lessReversePattern
        );

    if (greater) {
        min =
            Number(greater[1]);
    }

    if (less) {
        max =
            Number(less[1]);
    }

    if (greaterReverse) {
        max =
            Number(greaterReverse[1]);
    }

    if (lessReverse) {
        min =
            Number(lessReverse[1]);
    }

    if (
        min === null &&
        max === null
    ) {
        return null;
    }

    return {
        min:
            min === null
                ? 0
                : min,

        max:
            max === null
                ? getProgramWidth()
                : max
    };
}

function extractMouseRectangles(code) {
    const found = [];

    const ifRegex =
        /if\s*\(([\s\S]*?)\)\s*\{/g;

    let match;

    while (
        (match = ifRegex.exec(code)) !== null
    ) {
        const condition =
            match[1];

        if (
            !/mouseX|mouseY/.test(
                condition
            )
        ) {
            continue;
        }

        const xRange =
            extractCoordinateRange(
                condition,
                "mouseX"
            );

        const yRange =
            extractCoordinateRange(
                condition,
                "mouseY"
            );

        if (!xRange || !yRange) {
            continue;
        }

        const x =
            xRange.min;

        const y =
            yRange.min;

        const width =
            xRange.max - xRange.min;

        const height =
            yRange.max - yRange.min;

        if (
            width <= 0 ||
            height <= 0
        ) {
            continue;
        }

        found.push({
            x: x,
            y: y,
            width: width,
            height: height,

            original: true,

            originalCode:
                match[0],

            originalX:
                x,

            originalY:
                y,

            originalWidth:
                width,

            originalHeight:
                height,

            id:
                crypto.randomUUID()
        });
    }

    return found;
}

function resizeProgramDisplay() {
    const width =
        getProgramWidth();

    const height =
        getProgramHeight();

    program.style.width =
        width + "px";

    program.style.height =
        height + "px";

    overlay.width =
        width;

    overlay.height =
        height;

    overlay.style.width =
        width + "px";

    overlay.style.height =
        height + "px";

    drawRectangles();
}

function getCanvasScale() {
    const width =
        getProgramWidth();

    const height =
        getProgramHeight();

    return {
        x: width / 400,
        y: height / 400
    };
}

function drawHandles(r) {
    const size = 7;

    const handles = [
        [r.x, r.y],
        [r.x + r.width / 2, r.y],
        [r.x + r.width, r.y],
        [r.x, r.y + r.height / 2],
        [r.x + r.width, r.y + r.height / 2],
        [r.x, r.y + r.height],
        [r.x + r.width / 2, r.y + r.height],
        [r.x + r.width, r.y + r.height]
    ];

    ctx.fillStyle =
        "#ffffff";

    ctx.strokeStyle =
        "#111111";

    ctx.lineWidth = 1;

    for (const handle of handles) {
        ctx.beginPath();

        ctx.rect(
            handle[0] - size / 2,
            handle[1] - size / 2,
            size,
            size
        );

        ctx.fill();

        ctx.stroke();
    }
}

function drawRectangles(
    preview = null
) {
    const width =
        getProgramWidth();

    const height =
        getProgramHeight();

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    for (
        let i = 0;
        i < rectangles.length;
        i++
    ) {
        const r =
            rectangles[i];

        ctx.save();

        if (r.original) {
            ctx.fillStyle =
                "rgba(40, 145, 255, 0.18)";

            ctx.strokeStyle =
                "rgba(90, 180, 255, 0.95)";
        } else {
            ctx.fillStyle =
                "rgba(170, 80, 255, 0.18)";

            ctx.strokeStyle =
                "rgba(190, 120, 255, 0.95)";
        }

        if (
            i === selectedRectangle
        ) {
            ctx.fillStyle =
                "rgba(255, 210, 70, 0.2)";

            ctx.strokeStyle =
                "rgba(255, 220, 90, 1)";

            ctx.lineWidth = 2;
        } else {
            ctx.lineWidth = 1.5;
        }

        ctx.fillRect(
            r.x,
            r.y,
            r.width,
            r.height
        );

        ctx.strokeRect(
            r.x,
            r.y,
            r.width,
            r.height
        );

        if (
            mode === "edit" &&
            i === selectedRectangle
        ) {
            drawHandles(r);
        }

        ctx.restore();
    }

    if (preview) {
        ctx.save();

        ctx.fillStyle =
            "rgba(255, 255, 255, 0.1)";

        ctx.strokeStyle =
            "rgba(255, 255, 255, 0.9)";

        ctx.setLineDash([
            6,
            4
        ]);

        ctx.strokeRect(
            preview.x,
            preview.y,
            preview.width,
            preview.height
        );

        ctx.fillRect(
            preview.x,
            preview.y,
            preview.width,
            preview.height
        );

        ctx.restore();
    }
}

function getMousePosition(event) {
    const bounds =
        overlay.getBoundingClientRect();

    const width =
        getProgramWidth();

    const height =
        getProgramHeight();

    return {
        x: Math.max(
            0,
            Math.min(
                width,
                (event.clientX - bounds.left) *
                (width / bounds.width)
            )
        ),

        y: Math.max(
            0,
            Math.min(
                height,
                (event.clientY - bounds.top) *
                (height / bounds.height)
            )
        )
    };
}

function getRectangleAt(
    x,
    y
) {
    for (
        let i = rectangles.length - 1;
        i >= 0;
        i--
    ) {
        const r =
            rectangles[i];

        if (
            x >= r.x &&
            x <= r.x + r.width &&
            y >= r.y &&
            y <= r.y + r.height
        ) {
            return i;
        }
    }

    return -1;
}

function getHandleAt(
    x,
    y,
    r
) {
    const threshold = 10;

    const handles = [
        ["nw", r.x, r.y],
        [
            "n",
            r.x + r.width / 2,
            r.y
        ],
        [
            "ne",
            r.x + r.width,
            r.y
        ],
        [
            "w",
            r.x,
            r.y + r.height / 2
        ],
        [
            "e",
            r.x + r.width,
            r.y + r.height / 2
        ],
        [
            "sw",
            r.x,
            r.y + r.height
        ],
        [
            "s",
            r.x + r.width / 2,
            r.y + r.height
        ],
        [
            "se",
            r.x + r.width,
            r.y + r.height
        ]
    ];

    for (const handle of handles) {
        if (
            Math.abs(
                x - handle[1]
            ) <= threshold &&
            Math.abs(
                y - handle[2]
            ) <= threshold
        ) {
            return handle[0];
        }
    }

    return "";
}

function setMode(
    nextMode
) {
    mode =
        nextMode;

    normalButton.classList.toggle(
        "active",
        mode === "normal"
    );

    rectButton.classList.toggle(
        "active",
        mode === "rect"
    );

    editRectsButton.classList.toggle(
        "active",
        mode === "edit"
    );

    editPanel.style.display =
        mode === "edit"
            ? "block"
            : "none";

    info.style.display =
        mode === "rect"
            ? "block"
            : "none";

    if (
        mode === "normal"
    ) {
        program.style.zIndex =
            "30";

        program.style.pointerEvents =
            "auto";

        overlay.style.zIndex =
            "1";

        overlay.style.pointerEvents =
            "none";

        selectedRectangle =
            -1;

        contextMenu.style.display =
            "none";
    } else {
        program.style.zIndex =
            "1";

        program.style.pointerEvents =
            "none";

        overlay.style.zIndex =
            "30";

        overlay.style.pointerEvents =
            "auto";
    }

    drawRectangles();
}

function runProgram() {
    const code =
        editor.value;

    rectangles =
        extractMouseRectangles(
            code
        );

    selectedRectangle =
        -1;

    contextRectangle =
        -1;

    const html =
        isFullHTML(code)
            ? code
            : createProcessingHTML(
                code
            );

    program.srcdoc =
        html;

    editor.style.display =
        "none";

    stage.style.display =
        "block";

    outputPanel.style.display =
        "none";

    setMode(
        "normal"
    );

    setTimeout(
        function() {
            resizeProgramDisplay();
            drawRectangles();
        },
        700
    );
}

function editProgram() {
    stage.style.display =
        "none";

    editor.style.display =
        "block";

    outputPanel.style.display =
        "none";

    contextMenu.style.display =
        "none";
}

function createMouseCondition(
    rectangle
) {
    const x1 =
        Math.round(
            rectangle.x
        );

    const y1 =
        Math.round(
            rectangle.y
        );

    const x2 =
        Math.round(
            rectangle.x +
            rectangle.width
        );

    const y2 =
        Math.round(
            rectangle.y +
            rectangle.height
        );

    return `if (mouseX > ${x1} && mouseX < ${x2} && mouseY > ${y1} && mouseY < ${y2}) {

}`;
}

function wasRectangleUpdated(
    rectangle
) {
    if (!rectangle.original) {
        return false;
    }

    return (
        rectangle.x !==
            rectangle.originalX ||

        rectangle.y !==
            rectangle.originalY ||

        rectangle.width !==
            rectangle.originalWidth ||

        rectangle.height !==
            rectangle.originalHeight
    );
}

function generateOutput() {
    const original = [];

    const updated = [];

    const newRectangles = [];

    for (
        const rectangle of rectangles
    ) {
        if (
            !rectangle.original
        ) {
            newRectangles.push(
                rectangle
            );
        } else if (
            wasRectangleUpdated(
                rectangle
            )
        ) {
            updated.push(
                rectangle
            );
        } else {
            original.push(
                rectangle
            );
        }
    }

    return {
        original:
            original
                .map(
                    createMouseCondition
                )
                .join("\n\n"),

        updated:
            updated
                .map(
                    createMouseCondition
                )
                .join("\n\n"),

        newRectangles:
            newRectangles
                .map(
                    createMouseCondition
                )
                .join("\n\n")
    };
}

function updateOutputSection(
    section,
    textarea,
    value
) {
    if (
        value.trim() === ""
    ) {
        section.style.display =
            "none";

        textarea.value =
            "";
    } else {
        section.style.display =
            "block";

        textarea.value =
            value;
    }
}

async function printOutput() {
    const result =
        generateOutput();

    updateOutputSection(
        originalSection,
        originalOutput,
        result.original
    );

    updateOutputSection(
        updatedSection,
        updatedOutput,
        result.updated
    );

    updateOutputSection(
        newSection,
        newOutput,
        result.newRectangles
    );

    const hasOutput =
        result.original ||
        result.updated ||
        result.newRectangles;

    if (!hasOutput) {
        outputPanel.style.display =
            "none";

        return;
    }

    outputPanel.style.display =
        "flex";

    const combined = [
        result.original,
        result.updated,
        result.newRectangles
    ]
        .filter(Boolean)
        .join("\n\n");

    try {
        await navigator.clipboard.writeText(
            combined
        );

        printButton.textContent =
            "Copied!";

        setTimeout(
            function() {
                printButton.textContent =
                    "Print / Copy";
            },
            1200
        );
    } catch {
        const firstVisible =
            document.querySelector(
                ".outputSection[style*='block'] .outputCode"
            );

        if (firstVisible) {
            firstVisible.focus();
            firstVisible.select();
        }
    }
}

function duplicateRectangle(
    index
) {
    if (
        index < 0 ||
        index >= rectangles.length
    ) {
        return;
    }

    const source =
        rectangles[index];

    const copy = {
        x:
            source.x + 10,

        y:
            source.y + 10,

        width:
            source.width,

        height:
            source.height,

        original:
            false,

        originalCode:
            "",

        originalX:
            null,

        originalY:
            null,

        originalWidth:
            null,

        originalHeight:
            null,

        id:
            crypto.randomUUID()
    };

    rectangles.push(
        copy
    );

    selectedRectangle =
        rectangles.length - 1;

    drawRectangles();
}

function copyRectangle(
    index
) {
    if (
        index < 0 ||
        index >= rectangles.length
    ) {
        return;
    }

    clipboardRectangle = {
        ...rectangles[index],
        id:
            crypto.randomUUID()
    };
}

function cutRectangle(
    index
) {
    copyRectangle(index);

    deleteRectangle(
        index
    );
}

function pasteRectangle() {
    if (
        !clipboardRectangle
    ) {
        return;
    }

    const copy = {
        ...clipboardRectangle,

        x:
            clipboardRectangle.x +
            10,

        y:
            clipboardRectangle.y +
            10,

        original:
            false,

        originalCode:
            "",

        originalX:
            null,

        originalY:
            null,

        originalWidth:
            null,

        originalHeight:
            null,

        id:
            crypto.randomUUID()
    };

    rectangles.push(
        copy
    );

    selectedRectangle =
        rectangles.length - 1;

    drawRectangles();
}

function deleteRectangle(
    index
) {
    if (
        index < 0 ||
        index >= rectangles.length
    ) {
        return;
    }

    rectangles.splice(
        index,
        1
    );

    if (
        selectedRectangle ===
        index
    ) {
        selectedRectangle =
            -1;
    } else if (
        selectedRectangle >
        index
    ) {
        selectedRectangle--;
    }

    drawRectangles();
}

function showContextMenu(
    x,
    y,
    index
) {
    contextRectangle =
        index;

    contextMenu.style.left =
        x + "px";

    contextMenu.style.top =
        y + "px";

    contextMenu.style.display =
        "block";

    const paste =
        contextMenu.querySelector(
            '[data-action="paste"]'
        );

    paste.style.display =
        clipboardRectangle
            ? "block"
            : "none";
}

function hideContextMenu() {
    contextMenu.style.display =
        "none";

    contextRectangle =
        -1;
}

overlay.addEventListener(
    "mousedown",
    function(event) {
        if (
            mode === "normal"
        ) {
            return;
        }

        const pos =
            getMousePosition(
                event
            );

        if (
            event.button === 2
        ) {
            event.preventDefault();

            if (
                mode === "edit"
            ) {
                const index =
                    getRectangleAt(
                        pos.x,
                        pos.y
                    );

                if (
                    index !== -1
                ) {
                    selectedRectangle =
                        index;

                    drawRectangles();

                    showContextMenu(
                        event.clientX,
                        event.clientY,
                        index
                    );
                }
            }

            return;
        }

        hideContextMenu();

        if (
            mode === "rect"
        ) {
            startX =
                pos.x;

            startY =
                pos.y;

            drawing =
                true;

            return;
        }

        if (
            mode === "edit"
        ) {
            const index =
                getRectangleAt(
                    pos.x,
                    pos.y
                );

            if (
                index === -1
            ) {
                selectedRectangle =
                    -1;

                drawRectangles();

                return;
            }

            selectedRectangle =
                index;

            const rectangle =
                rectangles[index];

            const handle =
                getHandleAt(
                    pos.x,
                    pos.y,
                    rectangle
                );

            if (handle) {
                editing =
                    true;

                editAction =
                    "resize";

                resizeHandle =
                    handle;
            } else {
                editing =
                    true;

                editAction =
                    "move";

                dragOffsetX =
                    pos.x -
                    rectangle.x;

                dragOffsetY =
                    pos.y -
                    rectangle.y;
            }

            drawRectangles();
        }
    }
);

overlay.addEventListener(
    "mousemove",
    function(event) {
        if (
            mode === "normal"
        ) {
            return;
        }

        const pos =
            getMousePosition(
                event
            );

        const width =
            getProgramWidth();

        const height =
            getProgramHeight();

        if (
            mode === "rect" &&
            drawing
        ) {
            const rectangle =
                normalizeRectangle(
                    startX,
                    startY,
                    pos.x,
                    pos.y
                );

            info.textContent =
                "X: " +
                Math.round(
                    rectangle.x
                ) +
                "  Y: " +
                Math.round(
                    rectangle.y
                ) +
                "  W: " +
                Math.round(
                    rectangle.width
                ) +
                "  H: " +
                Math.round(
                    rectangle.height
                );

            drawRectangles(
                rectangle
            );

            return;
        }

        if (
            mode === "edit" &&
            editing &&
            selectedRectangle !== -1
        ) {
            const rectangle =
                rectangles[
                    selectedRectangle
                ];

            if (
                editAction ===
                "move"
            ) {
                rectangle.x =
                    pos.x -
                    dragOffsetX;

                rectangle.y =
                    pos.y -
                    dragOffsetY;
            }

            if (
                editAction ===
                "resize"
            ) {
                if (
                    resizeHandle.includes(
                        "e"
                    )
                ) {
                    rectangle.width =
                        pos.x -
                        rectangle.x;
                }

                if (
                    resizeHandle.includes(
                        "s"
                    )
                ) {
                    rectangle.height =
                        pos.y -
                        rectangle.y;
                }

                if (
                    resizeHandle.includes(
                        "w"
                    )
                ) {
                    const right =
                        rectangle.x +
                        rectangle.width;

                    rectangle.x =
                        pos.x;

                    rectangle.width =
                        right -
                        rectangle.x;
                }

                if (
                    resizeHandle.includes(
                        "n"
                    )
                ) {
                    const bottom =
                        rectangle.y +
                        rectangle.height;

                    rectangle.y =
                        pos.y;

                    rectangle.height =
                        bottom -
                        rectangle.y;
                }

                if (
                    rectangle.width <
                    2
                ) {
                    rectangle.width =
                        2;
                }

                if (
                    rectangle.height <
                    2
                ) {
                    rectangle.height =
                        2;
                }
            }

            rectangle.x =
                Math.max(
                    0,
                    Math.min(
                        width -
                        rectangle.width,
                        rectangle.x
                    )
                );

            rectangle.y =
                Math.max(
                    0,
                    Math.min(
                        height -
                        rectangle.height,
                        rectangle.y
                    )
                );

            rectangle.width =
                Math.min(
                    rectangle.width,
                    width -
                    rectangle.x
                );

            rectangle.height =
                Math.min(
                    rectangle.height,
                    height -
                    rectangle.y
                );

            drawRectangles();
        }
    }
);

overlay.addEventListener(
    "mouseup",
    function(event) {
        if (
            mode === "rect" &&
            drawing
        ) {
            const pos =
                getMousePosition(
                    event
                );

            const rectangle =
                normalizeRectangle(
                    startX,
                    startY,
                    pos.x,
                    pos.y
                );

            drawing =
                false;

            if (
                rectangle.width >=
                    2 &&
                rectangle.height >=
                    2
            ) {
                rectangles.push({
                    ...rectangle,

                    original:
                        false,

                    originalCode:
                        "",

                    originalX:
                        null,

                    originalY:
                        null,

                    originalWidth:
                        null,

                    originalHeight:
                        null,

                    id:
                        crypto.randomUUID()
                });

                selectedRectangle =
                    rectangles.length -
                    1;
            }

            drawRectangles();

            return;
        }

        if (
            mode === "edit"
        ) {
            editing =
                false;

            editAction =
                "";

            resizeHandle =
                "";

            drawRectangles();
        }
    }
);

overlay.addEventListener(
    "mouseleave",
    function() {
        if (
            mode === "rect" &&
            drawing
        ) {
            drawing =
                false;

            drawRectangles();
        }

        if (
            mode === "edit"
        ) {
            editing =
                false;

            editAction =
                "";

            resizeHandle =
                "";
        }
    }
);

overlay.addEventListener(
    "contextmenu",
    function(event) {
        event.preventDefault();
    }
);

document.addEventListener(
    "mousedown",
    function(event) {
        if (
            !contextMenu.contains(
                event.target
            ) &&
            event.target !== overlay
        ) {
            hideContextMenu();
        }
    }
);

document.addEventListener(
    "keydown",
    function(event) {
        if (
            mode !== "edit"
        ) {
            return;
        }

        if (
            event.key ===
                "Delete" &&
            selectedRectangle !== -1
        ) {
            deleteRectangle(
                selectedRectangle
            );
        }

        if (
            event.key ===
                "Escape"
        ) {
            selectedRectangle =
                -1;

            editing =
                false;

            drawRectangles();
        }
    }
);

contextMenu.addEventListener(
    "click",
    function(event) {
        const item =
            event.target.closest(
                ".contextItem"
            );

        if (!item) {
            return;
        }

        const action =
            item.dataset.action;

        const index =
            contextRectangle;

        hideContextMenu();

        if (
            action ===
            "duplicate"
        ) {
            duplicateRectangle(
                index
            );
        }

        if (
            action ===
            "cut"
        ) {
            cutRectangle(
                index
            );
        }

        if (
            action ===
            "copy"
        ) {
            copyRectangle(
                index
            );
        }

        if (
            action ===
            "paste"
        ) {
            pasteRectangle();
        }

        if (
            action ===
            "delete"
        ) {
            deleteRectangle(
                index
            );
        }
    }
);

runButton.addEventListener(
    "click",
    runProgram
);

editButton.addEventListener(
    "click",
    editProgram
);

normalButton.addEventListener(
    "click",
    function() {
        setMode(
            "normal"
        );
    }
);

rectButton.addEventListener(
    "click",
    function() {
        setMode(
            "rect"
        );
    }
);

editRectsButton.addEventListener(
    "click",
    function() {
        setMode(
            "edit"
        );
    }
);

printButton.addEventListener(
    "click",
    printOutput
);

clearButton.addEventListener(
    "click",
    function() {
        rectangles = [];

        selectedRectangle =
            -1;

        outputPanel.style.display =
            "none";

        originalOutput.value =
            "";

        updatedOutput.value =
            "";

        newOutput.value =
            "";

        drawRectangles();
    }
);

widthInput.addEventListener(
    "change",
    resizeProgramDisplay
);

heightInput.addEventListener(
    "change",
    resizeProgramDisplay
);

window.addEventListener(
    "resize",
    drawRectangles
);

setMode(
    "normal"
);

resizeProgramDisplay();
</script>

</body>
</html>
