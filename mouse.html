<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProcessingJS Mouse Rectangle Editor</title>
<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #151515;
    color: white;
    font-family: Arial, sans-serif;
}

#app {
    display: flex;
    width: 100%;
    height: 100%;
}

#sidebar {
    width: 180px;
    min-width: 180px;
    height: 100%;
    background: #202020;
    border-right: 1px solid #444;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    z-index: 100;
}

#sidebar button {
    width: 100%;
    min-height: 38px;
    background: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
}

#sidebar button:hover {
    background: #414141;
}

#sidebar button.active {
    background: #1267a5;
    border-color: #63b8ff;
}

#sizeBox {
    border-top: 1px solid #444;
    margin-top: 5px;
    padding-top: 10px;
}

#sizeBox label {
    display: block;
    font-size: 12px;
    color: #aaa;
    margin-bottom: 3px;
}

#sizeBox input {
    width: 100%;
    height: 30px;
    margin-bottom: 7px;
    background: #111;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 5px 7px;
}

#main {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 100%;
}

#editor {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    padding: 15px;
    border: 0;
    outline: 0;
    resize: none;
    background: #101010;
    color: #eee;
    font: 14px/1.45 monospace;
    tab-size: 4;
    white-space: pre;
    overflow: auto;
}

#stage {
    position: absolute;
    inset: 0;
    display: none;
    overflow: hidden;
    background: #252525;
}

#program {
    position: absolute;
    border: 0;
    background: white;
    display: block;
}

#overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#info {
    position: absolute;
    left: 10px;
    top: 10px;
    background: rgba(0, 0, 0, 0.82);
    border: 1px solid #555;
    border-radius: 5px;
    padding: 7px 9px;
    font: 12px monospace;
    display: none;
    z-index: 20;
    pointer-events: none;
}

#outputs {
    position: absolute;
    right: 10px;
    top: 10px;
    width: 310px;
    max-height: calc(100% - 20px);
    overflow-y: auto;
    display: none;
    flex-direction: column;
    gap: 8px;
    z-index: 40;
    pointer-events: none;
}

.outputBox {
    background: rgba(15, 15, 15, 0.95);
    border: 1px solid #555;
    border-radius: 6px;
    overflow: hidden;
    pointer-events: auto;
}

.outputTitle {
    padding: 7px 9px;
    background: #292929;
    border-bottom: 1px solid #444;
    font-size: 12px;
    font-weight: bold;
}

.outputText {
    width: 100%;
    min-height: 70px;
    max-height: 250px;
    display: block;
    resize: vertical;
    border: 0;
    outline: 0;
    padding: 9px;
    background: #101010;
    color: #b7ffb7;
    font: 12px/1.4 monospace;
}

#contextMenu {
    position: fixed;
    display: none;
    width: 145px;
    background: #252525;
    border: 1px solid #555;
    border-radius: 5px;
    padding: 4px;
    z-index: 1000;
    box-shadow: 0 5px 18px rgba(0,0,0,0.5);
}

#contextMenu button {
    display: block;
    width: 100%;
    background: transparent;
    color: white;
    border: 0;
    text-align: left;
    padding: 8px;
    border-radius: 3px;
    cursor: pointer;
}

#contextMenu button:hover {
    background: #1267a5;
}

#contextMenu .danger:hover {
    background: #9b3030;
}

#status {
    margin-top: auto;
    color: #777;
    font: 10px monospace;
    line-height: 1.3;
    word-break: break-word;
}
</style>
</head>
<body>

<div id="app">
    <aside id="sidebar">
        <button id="runButton">Run</button>
        <button id="editButton">Edit Code</button>
        <button id="normalButton" class="active">Normal Mode</button>
        <button id="rectButton">Rect Mode</button>
        <button id="editRectButton">Edit Rects</button>
        <button id="printButton">Print / Copy</button>
        <button id="clearButton">Clear Rects</button>

        <div id="sizeBox">
            <label for="widthInput">Canvas Width</label>
            <input id="widthInput" type="number" min="1" step="1" value="400">

            <label for="heightInput">Canvas Height</label>
            <input id="heightInput" type="number" min="1" step="1" value="400">
        </div>

        <div id="status"></div>
    </aside>

    <main id="main">
        <textarea id="editor" spellcheck="false">size(400, 400);
background(220);

fill(255, 0, 0);
rect(20, 120, 340, 45);

fill(0, 0, 255);
rect(20, 170, 340, 45);

function mousePressed() {
    if (mouseX >= 20 && mouseX <= 360 && mouseY >= 120 && mouseY <= 165) {
        println("First button");
    }

    if (mouseX >= 20 && mouseX <= 360 && mouseY >= 170 && mouseY <= 215) {
        println("Second button");
    }
}</textarea>

        <div id="stage">
            <iframe id="program" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            <canvas id="overlay"></canvas>
            <div id="info"></div>

            <div id="outputs">
                <div id="originalBox" class="outputBox">
                    <div class="outputTitle">Originally</div>
                    <textarea id="originalOutput" class="outputText" readonly></textarea>
                </div>

                <div id="updatedBox" class="outputBox">
                    <div class="outputTitle">Updated</div>
                    <textarea id="updatedOutput" class="outputText" readonly></textarea>
                </div>

                <div id="newBox" class="outputBox">
                    <div class="outputTitle">New</div>
                    <textarea id="newOutput" class="outputText" readonly></textarea>
                </div>
            </div>
        </div>
    </main>
</div>

<div id="contextMenu">
    <button id="duplicateButton">Duplicate</button>
    <button id="cutButton">Cut</button>
    <button id="copyButton">Copy</button>
    <button id="pasteButton">Paste</button>
    <button id="deleteButton" class="danger">Delete</button>
</div>

<script>
const editor = document.getElementById("editor");
const stage = document.getElementById("stage");
const program = document.getElementById("program");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d", { alpha: true });

const info = document.getElementById("info");
const outputs = document.getElementById("outputs");
const originalBox = document.getElementById("originalBox");
const updatedBox = document.getElementById("updatedBox");
const newBox = document.getElementById("newBox");
const originalOutput = document.getElementById("originalOutput");
const updatedOutput = document.getElementById("updatedOutput");
const newOutput = document.getElementById("newOutput");

const runButton = document.getElementById("runButton");
const editButton = document.getElementById("editButton");
const normalButton = document.getElementById("normalButton");
const rectButton = document.getElementById("rectButton");
const editRectButton = document.getElementById("editRectButton");
const printButton = document.getElementById("printButton");
const clearButton = document.getElementById("clearButton");

const widthInput = document.getElementById("widthInput");
const heightInput = document.getElementById("heightInput");
const status = document.getElementById("status");

const contextMenu = document.getElementById("contextMenu");
const duplicateButton = document.getElementById("duplicateButton");
const cutButton = document.getElementById("cutButton");
const copyButton = document.getElementById("copyButton");
const pasteButton = document.getElementById("pasteButton");
const deleteButton = document.getElementById("deleteButton");

let mode = "normal";
let rectangles = [];
let selectedRectangle = null;
let clipboardRectangle = null;

let drawing = false;
let dragging = false;
let resizing = false;

let startX = 0;
let startY = 0;
let dragOffsetX = 0;
let dragOffsetY = 0;
let resizeStartX = 0;
let resizeStartY = 0;
let resizeOriginal = null;

let canvasWidth = 400;
let canvasHeight = 400;

let drawQueued = false;
let currentTempRectangle = null;

const MIN_RECT_SIZE = 2;
const RESIZE_HANDLE = 8;

function queueDraw() {
    if (drawQueued) {
        return;
    }

    drawQueued = true;

    requestAnimationFrame(function() {
        drawQueued = false;
        drawRectangles();
    });
}

function setStatus(text) {
    status.textContent = text;
}

function escapeHTML(value) {
    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

function hasSizeCall(code) {
    return /\bsize\s*\(/.test(code);
}

function getCanvasSize() {
    let width = parseInt(widthInput.value, 10);
    let height = parseInt(heightInput.value, 10);

    if (!Number.isFinite(width) || width < 1) {
        width = 400;
    }

    if (!Number.isFinite(height) || height < 1) {
        height = 400;
    }

    return {
        width,
        height
    };
}

function isFullHTML(code) {
    const head = code.slice(0, 5000);

    return (
        /<!doctype\s+html/i.test(head) ||
        /<html(?:\s|>)/i.test(head) ||
        /<body(?:\s|>)/i.test(head)
    );
}

function injectSizeIntoProcessingHTML(html, width, height) {
    if (hasSizeCall(html)) {
        return html;
    }

    const canvasPattern = /<canvas\b([^>]*)>/i;
    const match = html.match(canvasPattern);

    if (match) {
        const attributes = match[1]
            .replace(/\swidth\s*=\s*["'][^"']*["']/gi, "")
            .replace(/\sheight\s*=\s*["'][^"']*["']/gi, "");

        const replacement =
            "<canvas" +
            attributes +
            ' width="' + width + '"' +
            ' height="' + height + '">';

        return html.replace(canvasPattern, replacement);
    }

    return html;
}

function createProcessingHTML(source, width, height) {
    const sizeCode = hasSizeCall(source)
        ? ""
        : "size(" + width + ", " + height + ");";

    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ProcessingJS Program</title>
<style>
html,body {
    margin:0;
    padding:0;
    overflow:hidden;
}
canvas {
    display:block;
}
</style>
</head>
<body>
<canvas id="mycanvas" width="${width}" height="${height}"></canvas>
<script src="https://cdn.jsdelivr.net/processing.js/1.4.8/processing.min.js"><\\/script>
<script>
var programCode = function(processingInstance) {
    with (processingInstance) {
        ${sizeCode}
        ${source}
    }
};

var canvas = document.getElementById("mycanvas");
new Processing(canvas, programCode);
<\\/script>
</body>
</html>`;
}

function getProgramHTML() {
    const source = editor.value;

    if (isFullHTML(source)) {
        return injectSizeIntoProcessingHTML(
            source,
            canvasWidth,
            canvasHeight
        );
    }

    return createProcessingHTML(
        source,
        canvasWidth,
        canvasHeight
    );
}

function findMatchingBrace(text, openIndex) {
    let depth = 0;
    let quote = null;
    let escaped = false;
    let lineComment = false;
    let blockComment = false;

    for (let i = openIndex; i < text.length; i++) {
        const c = text[i];
        const n = text[i + 1];

        if (lineComment) {
            if (c === "\n") {
                lineComment = false;
            }
            continue;
        }

        if (blockComment) {
            if (c === "*" && n === "/") {
                blockComment = false;
                i++;
            }
            continue;
        }

        if (quote) {
            if (escaped) {
                escaped = false;
            } else if (c === "\\") {
                escaped = true;
            } else if (c === quote) {
                quote = null;
            }
            continue;
        }

        if (c === "/" && n === "/") {
            lineComment = true;
            i++;
            continue;
        }

        if (c === "/" && n === "*") {
            blockComment = true;
            i++;
            continue;
        }

        if (c === "\"" || c === "'" || c === "`") {
            quote = c;
            continue;
        }

        if (c === "{") {
            depth++;
        } else if (c === "}") {
            depth--;

            if (depth === 0) {
                return i;
            }
        }
    }

    return -1;
}

function getMouseHandlerBodies(source) {
    const handlers = [];
    const pattern = /\b(?:mousePressed|mouseClicked|mouseReleased|mouseDragged|mouseMoved|mouseOver|mouseOut)\s*=\s*function\s*\([^)]*\)\s*\{|\bfunction\s+(?:mousePressed|mouseClicked|mouseReleased|mouseDragged|mouseMoved|mouseOver|mouseOut)\s*\([^)]*\)\s*\{/g;

    let match;

    while ((match = pattern.exec(source)) !== null) {
        const openBrace = source.indexOf("{", match.index);

        if (openBrace < 0) {
            continue;
        }

        const closeBrace = findMatchingBrace(source, openBrace);

        if (closeBrace < 0) {
            continue;
        }

        handlers.push(source.slice(openBrace + 1, closeBrace));

        pattern.lastIndex = closeBrace + 1;
    }

    return handlers;
}

function parseMouseRectangles(source) {
    const handlers = getMouseHandlerBodies(source);

    if (handlers.length === 0) {
        return [];
    }

    const found = [];
    const conditionPattern = /\bif\s*\(([^{}]*)\)/g;

    for (const body of handlers) {
        let match;

        while ((match = conditionPattern.exec(body)) !== null) {
            const condition = match[1];

            if (
                !/\bmouseX\b/.test(condition) ||
                !/\bmouseY\b/.test(condition)
            ) {
                continue;
            }

            const xValues = [];
            const yValues = [];

            const xPattern = /mouseX\s*(<=|>=|<|>)\s*(-?(?:\d+(?:\.\d*)?|\.\d+))/g;
            const yPattern = /mouseY\s*(<=|>=|<|>)\s*(-?(?:\d+(?:\.\d*)?|\.\d+))/g;

            let xMatch;
            let yMatch;

            while ((xMatch = xPattern.exec(condition)) !== null) {
                xValues.push({
                    operator: xMatch[1],
                    value: Number(xMatch[2])
                });
            }

            while ((yMatch = yPattern.exec(condition)) !== null) {
                yValues.push({
                    operator: yMatch[1],
                    value: Number(yMatch[2])
                });
            }

            if (xValues.length < 2 || yValues.length < 2) {
                continue;
            }

            let minX = Infinity;
            let maxX = -Infinity;
            let minY = Infinity;
            let maxY = -Infinity;

            for (const item of xValues) {
                if (item.operator === ">=" || item.operator === ">") {
                    minX = Math.max(minX, item.value);
                } else {
                    maxX = Math.min(maxX, item.value);
                }
            }

            for (const item of yValues) {
                if (item.operator === ">=" || item.operator === ">") {
                    minY = Math.max(minY, item.value);
                } else {
                    maxY = Math.min(maxY, item.value);
                }
            }

            if (
                !Number.isFinite(minX) ||
                !Number.isFinite(maxX) ||
                !Number.isFinite(minY) ||
                !Number.isFinite(maxY) ||
                maxX <= minX ||
                maxY <= minY
            ) {
                continue;
            }

            found.push({
                x: minX,
                y: minY,
                width: maxX - minX,
                height: maxY - minY,
                originalX: minX,
                originalY: minY,
                originalWidth: maxX - minX,
                originalHeight: maxY - minY,
                original: true
            });
        }
    }

    return found;
}

function extractMouseRectangles(source) {
    const parsedSource = isFullHTML(source)
        ? extractProcessingScripts(source)
        : source;

    return parseMouseRectangles(parsedSource);
}

function extractProcessingScripts(html) {
    const scripts = [];
    const pattern = /<script\b[^>]*>([\s\S]*?)<\/script>/gi;
    let match;

    while ((match = pattern.exec(html)) !== null) {
        const text = match[1];

        if (
            /\bmousePressed\b|\bmouseClicked\b|\bmouseReleased\b|\bmouseDragged\b/.test(text)
        ) {
            scripts.push(text);
        }
    }

    return scripts.join("\n");
}

function sameRectangle(a, b) {
    return (
        Math.abs(a.x - b.x) < 0.01 &&
        Math.abs(a.y - b.y) < 0.01 &&
        Math.abs(a.width - b.width) < 0.01 &&
        Math.abs(a.height - b.height) < 0.01
    );
}

function getCanvasInformation() {
    try {
        const iframeRect = program.getBoundingClientRect();
        const canvas = program.contentDocument.querySelector("canvas");

        if (!canvas) {
            return null;
        }

        const canvasRect = canvas.getBoundingClientRect();
        const stageRect = stage.getBoundingClientRect();

        return {
            x: iframeRect.left + canvasRect.left - stageRect.left,
            y: iframeRect.top + canvasRect.top - stageRect.top,
            width: canvasRect.width,
            height: canvasRect.height
        };
    } catch {
        return null;
    }
}

function processingToScreen(rectangle) {
    const canvas = getCanvasInformation();

    if (!canvas || canvas.width <= 0 || canvas.height <= 0) {
        return {
            x: rectangle.x,
            y: rectangle.y,
            width: rectangle.width,
            height: rectangle.height
        };
    }

    return {
        x: canvas.x + rectangle.x * canvas.width / canvasWidth,
        y: canvas.y + rectangle.y * canvas.height / canvasHeight,
        width: rectangle.width * canvas.width / canvasWidth,
        height: rectangle.height * canvas.height / canvasHeight
    };
}

function screenToProcessing(rectangle) {
    const canvas = getCanvasInformation();

    if (!canvas || canvas.width <= 0 || canvas.height <= 0) {
        return {
            x: rectangle.x,
            y: rectangle.y,
            width: rectangle.width,
            height: rectangle.height
        };
    }

    return {
        x: (rectangle.x - canvas.x) * canvasWidth / canvas.width,
        y: (rectangle.y - canvas.y) * canvasHeight / canvas.height,
        width: rectangle.width * canvasWidth / canvas.width,
        height: rectangle.height * canvasHeight / canvas.height
    };
}

function drawRectangles() {
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    for (let i = 0; i < rectangles.length; i++) {
        const r = processingToScreen(rectangles[i]);

        const selected = selectedRectangle === rectangles[i];

        ctx.fillStyle = selected
            ? "rgba(255,170,0,0.22)"
            : rectangles[i].original
                ? "rgba(0,140,255,0.22)"
                : "rgba(70,220,120,0.22)";

        ctx.fillRect(
            r.x,
            r.y,
            r.width,
            r.height
        );

        ctx.strokeStyle = selected
            ? "#ffb000"
            : rectangles[i].original
                ? "#00aaff"
                : "#48e080";

        ctx.lineWidth = selected ? 3 : 2;

        ctx.strokeRect(
            r.x,
            r.y,
            r.width,
            r.height
        );

        if (selected && mode === "edit") {
            drawResizeHandles(r);
        }
    }

    if (currentTempRectangle) {
        ctx.fillStyle = "rgba(0,170,255,0.2)";
        ctx.fillRect(
            currentTempRectangle.x,
            currentTempRectangle.y,
            currentTempRectangle.width,
            currentTempRectangle.height
        );

        ctx.strokeStyle = "#00aaff";
        ctx.lineWidth = 2;
        ctx.strokeRect(
            currentTempRectangle.x,
            currentTempRectangle.y,
            currentTempRectangle.width,
            currentTempRectangle.height
        );
    }
}

function drawResizeHandles(r) {
    const s = RESIZE_HANDLE;

    ctx.fillStyle = "#ffb000";

    ctx.fillRect(r.x - s / 2, r.y - s / 2, s, s);
    ctx.fillRect(r.x + r.width - s / 2, r.y - s / 2, s, s);
    ctx.fillRect(r.x - s / 2, r.y + r.height - s / 2, s, s);
    ctx.fillRect(
        r.x + r.width - s / 2,
        r.y + r.height - s / 2,
        s,
        s
    );
}

function resizeOverlay() {
    overlay.width = stage.clientWidth;
    overlay.height = stage.clientHeight;
    queueDraw();
}

function centerProgram() {
    const left = Math.max(
        0,
        (stage.clientWidth - canvasWidth) / 2
    );

    const top = Math.max(
        0,
        (stage.clientHeight - canvasHeight) / 2
    );

    program.style.left = left + "px";
    program.style.top = top + "px";
    program.style.width = canvasWidth + "px";
    program.style.height = canvasHeight + "px";

    queueDraw();
}

function runProgram() {
    const size = getCanvasSize();

    canvasWidth = size.width;
    canvasHeight = size.height;

    const source = editor.value;

    rectangles = extractMouseRectangles(source);
    selectedRectangle = null;
    currentTempRectangle = null;

    editor.style.display = "none";
    stage.style.display = "block";
    outputs.style.display = "none";

    centerProgram();

    program.style.pointerEvents = "auto";
    overlay.style.pointerEvents = "none";

    program.srcdoc = getProgramHTML();

    setStatus(
        "Loaded " +
        rectangles.length +
        " mouse rectangle" +
        (rectangles.length === 1 ? "" : "s")
    );

    setTimeout(function() {
        centerProgram();
        resizeOverlay();
    }, 150);

    setTimeout(function() {
        centerProgram();
        resizeOverlay();
    }, 500);
}

function editProgram() {
    stage.style.display = "none";
    editor.style.display = "block";
    outputs.style.display = "none";
    contextMenu.style.display = "none";
    setStatus("Code editor");
}

function setMode(newMode) {
    mode = newMode;
    contextMenu.style.display = "none";

    normalButton.classList.toggle(
        "active",
        mode === "normal"
    );

    rectButton.classList.toggle(
        "active",
        mode === "rect"
    );

    editRectButton.classList.toggle(
        "active",
        mode === "edit"
    );

    if (mode === "normal") {
        program.style.pointerEvents = "auto";
        overlay.style.pointerEvents = "none";
        info.style.display = "none";
        selectedRectangle = null;
        queueDraw();
        return;
    }

    program.style.pointerEvents = "none";
    overlay.style.pointerEvents = "auto";
    info.style.display = "block";

    if (mode === "rect") {
        info.textContent = "Drag to create a rectangle";
    } else {
        info.textContent =
            "Drag rectangles • drag corners to resize • right-click for options";
    }

    queueDraw();
}

function getPointerPosition(event) {
    const rect = overlay.getBoundingClientRect();

    return {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
    };
}

function normalizeRectangle(x1, y1, x2, y2) {
    return {
        x: Math.min(x1, x2),
        y: Math.min(y1, y2),
        width: Math.abs(x2 - x1),
        height: Math.abs(y2 - y1)
    };
}

function getRectangleAt(x, y) {
    for (let i = rectangles.length - 1; i >= 0; i--) {
        const r = processingToScreen(rectangles[i]);

        if (
            x >= r.x &&
            x <= r.x + r.width &&
            y >= r.y &&
            y <= r.y + r.height
        ) {
            return rectangles[i];
        }
    }

    return null;
}

function isNearResizeCorner(r, x, y) {
    const corners = [
        { x: r.x, y: r.y, type: "nw" },
        { x: r.x + r.width, y: r.y, type: "ne" },
        { x: r.x, y: r.y + r.height, type: "sw" },
        {
            x: r.x + r.width,
            y: r.y + r.height,
            type: "se"
        }
    ];

    for (const corner of corners) {
        if (
            Math.abs(x - corner.x) <= RESIZE_HANDLE &&
            Math.abs(y - corner.y) <= RESIZE_HANDLE
        ) {
            return corner.type;
        }
    }

    return null;
}

function showContextMenu(event, rectangle) {
    selectedRectangle = rectangle;

    contextMenu.style.left = event.clientX + "px";
    contextMenu.style.top = event.clientY + "px";
    contextMenu.style.display = "block";

    queueDraw();
}

function hideContextMenu() {
    contextMenu.style.display = "none";
}

function duplicateSelected() {
    if (!selectedRectangle) {
        return;
    }

    const copy = {
        x: selectedRectangle.x + 10,
        y: selectedRectangle.y + 10,
        width: selectedRectangle.width,
        height: selectedRectangle.height,
        originalX: selectedRectangle.x + 10,
        originalY: selectedRectangle.y + 10,
        originalWidth: selectedRectangle.width,
        originalHeight: selectedRectangle.height,
        original: false
    };

    rectangles.push(copy);
    selectedRectangle = copy;

    hideContextMenu();
    queueDraw();
}

function copySelected() {
    if (!selectedRectangle) {
        return;
    }

    clipboardRectangle = {
        x: selectedRectangle.x,
        y: selectedRectangle.y,
        width: selectedRectangle.width,
        height: selectedRectangle.height,
        originalX: selectedRectangle.originalX,
        originalY: selectedRectangle.originalY,
        originalWidth: selectedRectangle.originalWidth,
        originalHeight: selectedRectangle.originalHeight,
        original: selectedRectangle.original
    };

    hideContextMenu();
}

function cutSelected() {
    if (!selectedRectangle) {
        return;
    }

    clipboardRectangle = {
        x: selectedRectangle.x,
        y: selectedRectangle.y,
        width: selectedRectangle.width,
        height: selectedRectangle.height,
        originalX: selectedRectangle.originalX,
        originalY: selectedRectangle.originalY,
        originalWidth: selectedRectangle.originalWidth,
        originalHeight: selectedRectangle.originalHeight,
        original: selectedRectangle.original
    };

    rectangles = rectangles.filter(
        r => r !== selectedRectangle
    );

    selectedRectangle = null;

    hideContextMenu();
    queueDraw();
}

function pasteSelected() {
    if (!clipboardRectangle) {
        return;
    }

    const pasted = {
        x: clipboardRectangle.x + 10,
        y: clipboardRectangle.y + 10,
        width: clipboardRectangle.width,
        height: clipboardRectangle.height,
        originalX: clipboardRectangle.x + 10,
        originalY: clipboardRectangle.y + 10,
        originalWidth: clipboardRectangle.width,
        originalHeight: clipboardRectangle.height,
        original: false
    };

    rectangles.push(pasted);
    selectedRectangle = pasted;

    hideContextMenu();
    queueDraw();
}

function deleteSelected() {
    if (!selectedRectangle) {
        return;
    }

    rectangles = rectangles.filter(
        r => r !== selectedRectangle
    );

    selectedRectangle = null;

    hideContextMenu();
    queueDraw();
}

function getRectangleOutput(rectangle) {
    const x1 = Math.round(rectangle.x);
    const y1 = Math.round(rectangle.y);
    const x2 = Math.round(
        rectangle.x + rectangle.width
    );
    const y2 = Math.round(
        rectangle.y + rectangle.height
    );

    return (
        "if (mouseX >= " + x1 +
        " && mouseX <= " + x2 +
        " && mouseY >= " + y1 +
        " && mouseY <= " + y2 +
        ") {\n\n}"
    );
}

function getOutputGroups() {
    const original = [];
    const updated = [];
    const newlyCreated = [];

    for (const rectangle of rectangles) {
        const output = getRectangleOutput(rectangle);

        if (!rectangle.original) {
            newlyCreated.push(output);
        } else if (
            sameRectangle(
                rectangle,
                {
                    x: rectangle.originalX,
                    y: rectangle.originalY,
                    width: rectangle.originalWidth,
                    height: rectangle.originalHeight
                }
            )
        ) {
            original.push(output);
        } else {
            updated.push(output);
        }
    }

    return {
        original: original.join("\n\n"),
        updated: updated.join("\n\n"),
        newlyCreated: newlyCreated.join("\n\n")
    };
}

function updateOutputBox(box, textarea, value) {
    if (value.trim() === "") {
        box.style.display = "none";
        textarea.value = "";
        return;
    }

    box.style.display = "block";
    textarea.value = value;
}

async function printRectangles() {
    const groups = getOutputGroups();

    updateOutputBox(
        originalBox,
        originalOutput,
        groups.original
    );

    updateOutputBox(
        updatedBox,
        updatedOutput,
        groups.updated
    );

    updateOutputBox(
        newBox,
        newOutput,
        groups.newlyCreated
    );

    const allOutput = [
        groups.original,
        groups.updated,
        groups.newlyCreated
    ]
        .filter(Boolean)
        .join("\n\n");

    outputs.style.display =
        allOutput.trim() === ""
            ? "none"
            : "flex";

    if (allOutput.trim() !== "") {
        try {
            await navigator.clipboard.writeText(
                allOutput
            );

            printButton.textContent = "Copied!";

            setTimeout(function() {
                printButton.textContent =
                    "Print / Copy";
            }, 1000);
        } catch {
        }
    }
}

function clearRectangles() {
    rectangles = [];
    selectedRectangle = null;
    currentTempRectangle = null;
    outputs.style.display = "none";
    hideContextMenu();
    queueDraw();
}

overlay.addEventListener(
    "mousedown",
    function(event) {
        if (mode === "normal") {
            return;
        }

        hideContextMenu();

        const point = getPointerPosition(event);

        if (mode === "edit") {
            const rectangle =
                getRectangleAt(
                    point.x,
                    point.y
                );

            if (!rectangle) {
                selectedRectangle = null;
                queueDraw();
                return;
            }

            selectedRectangle = rectangle;

            const screenRectangle =
                processingToScreen(rectangle);

            const corner =
                isNearResizeCorner(
                    screenRectangle,
                    point.x,
                    point.y
                );

            if (corner) {
                resizing = true;
                resizeStartX = point.x;
                resizeStartY = point.y;
                resizeOriginal = {
                    x: rectangle.x,
                    y: rectangle.y,
                    width: rectangle.width,
                    height: rectangle.height
                };
            } else {
                dragging = true;

                dragOffsetX =
                    point.x - screenRectangle.x;

                dragOffsetY =
                    point.y - screenRectangle.y;
            }

            queueDraw();
            return;
        }

        drawing = true;
        startX = point.x;
        startY = point.y;

        currentTempRectangle = {
            x: point.x,
            y: point.y,
            width: 0,
            height: 0
        };

        queueDraw();
    }
);

overlay.addEventListener(
    "mousemove",
    function(event) {
        if (mode === "normal") {
            return;
        }

        const point = getPointerPosition(event);

        if (mode === "rect" && drawing) {
            currentTempRectangle =
                normalizeRectangle(
                    startX,
                    startY,
                    point.x,
                    point.y
                );

            const processingRectangle =
                screenToProcessing(
                    currentTempRectangle
                );

            info.textContent =
                "X: " +
                Math.round(processingRectangle.x) +
                "  Y: " +
                Math.round(processingRectangle.y) +
                "  W: " +
                Math.round(processingRectangle.width) +
                "  H: " +
                Math.round(processingRectangle.height);

            queueDraw();
            return;
        }

        if (
            mode === "edit" &&
            selectedRectangle &&
            dragging
        ) {
            const screenRectangle =
                processingToScreen(
                    selectedRectangle
                );

            screenRectangle.x =
                point.x - dragOffsetX;

            screenRectangle.y =
                point.y - dragOffsetY;

            const converted =
                screenToProcessing(
                    screenRectangle
                );

            selectedRectangle.x =
                converted.x;

            selectedRectangle.y =
                converted.y;

            selectedRectangle.original =
                false;

            queueDraw();
            return;
        }

        if (
            mode === "edit" &&
            selectedRectangle &&
            resizing
        ) {
            const dx =
                point.x - resizeStartX;

            const dy =
                point.y - resizeStartY;

            const canvas =
                getCanvasInformation();

            const scaleX =
                canvas
                    ? canvasWidth / canvas.width
                    : 1;

            const scaleY =
                canvas
                    ? canvasHeight / canvas.height
                    : 1;

            selectedRectangle.x =
                resizeOriginal.x;

            selectedRectangle.y =
                resizeOriginal.y;

            selectedRectangle.width =
                Math.max(
                    MIN_RECT_SIZE,
                    resizeOriginal.width +
                    dx * scaleX
                );

            selectedRectangle.height =
                Math.max(
                    MIN_RECT_SIZE,
                    resizeOriginal.height +
                    dy * scaleY
                );

            selectedRectangle.original =
                false;

            queueDraw();
        }
    }
);

overlay.addEventListener(
    "mouseup",
    function(event) {
        if (mode === "normal") {
            return;
        }

        const point = getPointerPosition(event);

        if (mode === "rect" && drawing) {
            const rectangle =
                normalizeRectangle(
                    startX,
                    startY,
                    point.x,
                    point.y
                );

            drawing = false;
            currentTempRectangle = null;

            if (
                rectangle.width >= MIN_RECT_SIZE &&
                rectangle.height >= MIN_RECT_SIZE
            ) {
                const converted =
                    screenToProcessing(
                        rectangle
                    );

                rectangles.push({
                    x: converted.x,
                    y: converted.y,
                    width: converted.width,
                    height: converted.height,
                    originalX: converted.x,
                    originalY: converted.y,
                    originalWidth: converted.width,
                    originalHeight: converted.height,
                    original: false
                });
            }

            info.textContent =
                "Drag to create a rectangle";

            queueDraw();
            return;
        }

        if (mode === "edit") {
            dragging = false;
            resizing = false;
            resizeOriginal = null;
            queueDraw();
        }
    }
);

overlay.addEventListener(
    "contextmenu",
    function(event) {
        if (mode !== "edit") {
            return;
        }

        event.preventDefault();

        const point = getPointerPosition(event);

        const rectangle =
            getRectangleAt(
                point.x,
                point.y
            );

        if (rectangle) {
            showContextMenu(
                event,
                rectangle
            );
        } else {
            hideContextMenu();
        }
    }
);

document.addEventListener(
    "mousedown",
    function(event) {
        if (!contextMenu.contains(event.target)) {
            hideContextMenu();
        }
    }
);

duplicateButton.addEventListener(
    "click",
    duplicateSelected
);

cutButton.addEventListener(
    "click",
    cutSelected
);

copyButton.addEventListener(
    "click",
    copySelected
);

pasteButton.addEventListener(
    "click",
    pasteSelected
);

deleteButton.addEventListener(
    "click",
    deleteSelected
);

runButton.addEventListener(
    "click",
    runProgram
);

editButton.addEventListener(
    "click",
    editProgram
);

normalButton.addEventListener(
    "click",
    function() {
        setMode("normal");
    }
);

rectButton.addEventListener(
    "click",
    function() {
        setMode("rect");
    }
);

editRectButton.addEventListener(
    "click",
    function() {
        setMode("edit");
    }
);

printButton.addEventListener(
    "click",
    printRectangles
);

clearButton.addEventListener(
    "click",
    clearRectangles
);

widthInput.addEventListener(
    "change",
    function() {
        const size = getCanvasSize();

        canvasWidth = size.width;

        if (stage.style.display !== "none") {
            centerProgram();
        }
    }
);

heightInput.addEventListener(
    "change",
    function() {
        const size = getCanvasSize();

        canvasHeight = size.height;

        if (stage.style.display !== "none") {
            centerProgram();
        }
    }
);

window.addEventListener(
    "resize",
    function() {
        if (stage.style.display !== "none") {
            centerProgram();
            resizeOverlay();
        }
    }
);

editor.addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Tab") {
            event.preventDefault();

            const start = editor.selectionStart;
            const end = editor.selectionEnd;

            editor.setRangeText(
                "    ",
                start,
                end,
                "end"
            );
        }
    }
);

setMode("normal");
resizeOverlay();
</script>
</body>
